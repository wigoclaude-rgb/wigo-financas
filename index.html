/* ----- SUB-TELAS DO RELATÓRIO: categoria e mês ----- */
function openCatDetail(cat){
  const val=t=>t.paid?(t.payAmt??t.amount):t.amount;
  const months=[]; let tot=0,mxx=1;
  for(let i=5;i>=0;i--){ const mk=addMonthsISO(viewMonth+"-01",-i).slice(0,7);
    const v=sum(txEffMonth(mk).filter(t=>t.type==="exp"&&t.dest!=="savings"&&t.cat===cat),val);
    months.push([mk,v]); tot+=v; mxx=Math.max(mxx,v); }
  const media=tot/6;
  const mks=months.map(([mk])=>mk);
  const win=S.tx.filter(t=>t.type==="exp"&&t.dest!=="savings"&&t.cat===cat&&mks.includes(effMonth(t)));
  const byVal=win.slice().sort((a,b)=>val(b)-val(a));
  const hi=byVal[0], lo=byVal[byVal.length-1];
  const list=win.slice().sort((a,b)=>a.due<b.due?1:-1).slice(0,40);
  openModal(modalHead(catIcon(cat)+" "+esc(cat),"análise dos últimos 6 meses")+
    '<div class="grid2" style="margin-bottom:12px">'+
      '<div class="stat mini"><div class="k">Média mensal</div><div class="v">'+fmt(media)+'</div></div>'+
      '<div class="stat mini"><div class="k">Total 6 meses</div><div class="v">'+fmt(tot)+'</div></div></div>'+
    months.map(([mk,v])=>'<div class="bar-row"><div class="bl"><span class="n" style="text-transform:capitalize">'+shortMonth(mk)+'</span><span class="v">'+fmt(v)+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(v/mxx*100)+'%"></div></div></div>').join("")+
    (hi?'<div class="help" style="margin:10px 0 0">Maior lançamento: <b>'+esc(hi.desc)+'</b> ('+fmt(val(hi))+') · Menor: <b>'+esc(lo.desc)+'</b> ('+fmt(val(lo))+')</div>':"")+
    (list.length?'<h3 style="font-size:13.5px;color:var(--violet-soft);margin:14px 0 4px">Lançamentos <span class="mini">'+win.length+' no período</span></h3><div class="list-plain">'+list.map(t=>txRow(t)).join("")+'</div>':'<div class="empty" style="margin-top:10px">Nenhum lançamento no período.</div>'));
}
function openMonthDetail(mk){
  const val=t=>t.paid?(t.payAmt??t.amount):t.amount;
  const em=txEffMonth(mk);
  const incL=em.filter(t=>t.type==="inc"), expL=em.filter(t=>t.type==="exp"&&t.dest!=="savings");
  const inc=sum(incL,val), exp=sum(expL,val);
  const by={}; expL.forEach(t=>{ by[t.cat]=(by[t.cat]||0)+val(t); });
  const byE=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const byM={}; expL.forEach(t=>{ const k=METHODS[t.method]||t.method||"Outros"; byM[k]=(byM[k]||0)+val(t); });
  const byME=Object.entries(byM).sort((a,b)=>b[1]-a[1]);
  let tot=0,n=0;
  for(let i=1;i<=6;i++){ const k=addMonthsISO(mk+"-01",-i).slice(0,7);
    const e=sum(txEffMonth(k).filter(t=>t.type==="exp"&&t.dest!=="savings"),val); if(e>0){tot+=e;n++;} }
  const media=n?tot/n:0; const dif=media?Math.round((exp-media)/media*100):null;
  openModal(modalHead("Detalhes de "+monthLabel(mk),"receitas × gastos · saldo do mês")+
    '<div class="grid3" style="margin-bottom:12px">'+
      '<div class="stat mini"><div class="k">Receitas</div><div class="v green">'+fmt(inc)+'</div></div>'+
      '<div class="stat mini"><div class="k">Gastos</div><div class="v red">'+fmt(exp)+'</div></div>'+
      '<div class="stat mini"><div class="k">Saldo</div><div class="v '+(inc-exp>=0?"green":"red")+'">'+fmt(inc-exp)+'</div></div></div>'+
    (dif!=null?'<div class="help" style="margin-bottom:6px">Gastos '+(dif>=0?"+":"")+dif+'% em relação à média dos 6 meses anteriores ('+fmt(media)+'/mês).</div>':"")+
    (byE.length?'<h3 style="font-size:13.5px;color:var(--violet-soft);margin:12px 0 6px">Por categoria</h3>'+bars(byE,exp):"")+
    (byME.length?'<h3 style="font-size:13.5px;color:var(--violet-soft);margin:16px 0 6px">Por forma de pagamento</h3>'+bars(byME,exp,"green"):"")+
    (!byE.length&&!incL.length?'<div class="empty">Sem lançamentos neste mês.</div>':""));
}

/* ============ EXPORTAÇÕES ============ */
function download(name,content,type){ const blob=new Blob([content],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function exportCSV(){
  const head=["Tipo","Descrição","Categoria","Forma","Cartão/Ticket","Parcela","Vencimento","Status","Data pagamento","Valor","Valor pago/recebido"];
  const clean=v=>String(v??"").replace(/;/g,",");
  const rows=S.tx.slice().sort((a,b)=>a.due<b.due?-1:1).map(t=>{
    const w=t.cardId?cardOf(t.cardId):(t.ticketId?ticketOf(t.ticketId):null);
    const wn=w?(w.nick||w.name):""; const s=statusOf(t);
    const tipo=t.dest==="savings"?"Poupança":(t.type==="inc"?"Receita":"Gasto");
    return [tipo,clean(t.desc),clean(t.cat),METHODS[t.method]||t.method,clean(wn),
      t.kind==="avista"?"":(t.i+"/"+t.n),fmtDate(t.due),stLabel(t),t.payDate?fmtDate(t.payDate):"",
      String(t.amount).replace(".",","),t.payAmt!=null?String(t.payAmt).replace(".",","):""].join(";"); });
  download("WIGO_lancamentos.csv","\uFEFF"+head.join(";")+"\r\n"+rows.join("\r\n"),"text/csv;charset=utf-8");
  toast("Planilha exportada ✓");
}

/* ============ EVENTOS ============ */
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  if(el.dataset.cmd) closeCmd();
  try{
  switch(a){
    case "auth-tab": setAuthMode(el.dataset.v); break;
    case "forgot": { const em=$("#authEmail").value.trim();
      if(!em){ authMsg("Digite seu e-mail acima e toque de novo."); break; }
      try{ await sendPasswordResetEmail(auth,em); authMsg("Link enviado para "+em+". Veja o spam também.",true); }
      catch(err){ authMsg(authErr(err)); } break; }
    case "tab": tab=el.dataset.v; homeFlt=null; resetFilters(); render(); break;
    case "home-filter": homeFlt=el.dataset.mode; render();
      setTimeout(()=>{ const p=document.querySelectorAll("#view .panel"); if(p.length){ p[p.length-1].scrollIntoView({behavior:"smooth",block:"start"}); } },30); break;
    case "home-filter-clear": homeFlt=null; render(); break;
    case "month-prev": viewMonth=addMonthsISO(viewMonth+"-01",-1).slice(0,7); homeFlt=null; render(); break;
    case "month-next": viewMonth=addMonthsISO(viewMonth+"-01",1).slice(0,7); homeFlt=null; render(); break;
    case "month-today": viewMonth=new Date().toISOString().slice(0,7); render(); break;
    case "open-add": openAdd(); break;
    case "close-modal": closeModal(); break;
    case "cmd-open": openCmd(); break;
    case "cmd-close": closeCmd(); break;
    case "seg-type": addType=el.dataset.v; syncAddForm(); break;
    case "seg-kind": addKind=el.dataset.v; syncAddForm(); break;
    // filtros
    case "flt-type": filters.type=el.dataset.v; render(); break;
    case "flt-status": filters.status=el.dataset.v; render(); break;
    case "flt-clear": resetFilters(); render(); break;
    // transações
    case "fatura-pay": openFatura(id); break;
    case "fatura-unpay": { if(!confirm("Desfazer o pagamento da fatura de "+shortMonth(viewMonth)+"?"))break;
      S.tx.forEach(t=>{ if(t.cardId===id&&t.type==="exp"&&mkey(t.due)===viewMonth&&t.paid) undoPaid(t); });
      save(); openCardDetail(id); render(); toast("Pagamento desfeito"); break; }
    case "tx-sel": { if(selTx.has(id)) selTx.delete(id); else selTx.add(id);
      el.classList.toggle("on",selTx.has(id)); updateSelBar(); break; }
    case "sel-all": { const all=curListIds.length&&curListIds.every(x=>selTx.has(x));
      if(all) curListIds.forEach(x=>selTx.delete(x)); else curListIds.forEach(x=>selTx.add(x));
      render(); break; }
    case "cat-detail": openCatDetail(el.dataset.cat); break;
    case "tut-next": tutStep=Math.min(TUT.length-1,tutStep+1); renderTutorial(); break;
    case "tut-prev": tutStep=Math.max(0,tutStep-1); renderTutorial(); break;
    case "tut-done": S.tutorialSeen=true; save(); closeModal(); break;
    case "tut-open": openTutorial(); break;
    case "month-detail": openMonthDetail(el.dataset.mk); break;
    case "sel-pay": { let n=0; const today=todayISO();
      selTx.forEach(sid=>{ const t=S.tx.find(x=>x.id===sid); if(t&&!t.paid){ applyPaid(t,today,t.amount); n++; } });
      selTx.clear(); save(); closeModal(); render(); toast(n+" lançamento(s) baixado(s) ✓"); break; }
    case "sel-clear": { selTx.clear();
      document.querySelectorAll(".selc.on").forEach(c=>c.classList.remove("on")); updateSelBar(); break; }
    case "tx-paid": openPaid(id); break;
    case "tx-unpaid": { const t=S.tx.find(x=>x.id===id); if(t){ undoPaid(t); save(); closeModal(); render(); toast("Desfeito"); } break; }
    case "tx-edit": openEdit(id); break;
    case "tx-delete": { if(!confirm("Excluir este lançamento?"))break;
      const t=S.tx.find(x=>x.id===id); if(t&&t.goalId){ const g=goalOf(t.goalId); if(g&&g.moves)g.moves=g.moves.filter(mv=>mv.txId!==id); }
      S.tx=S.tx.filter(x=>x.id!==id); save(); closeModal(); render(); toast("Excluído"); break; }
    case "tx-delete-group": { const t=S.tx.find(x=>x.id===id); if(!t)break;
      const n=S.tx.filter(x=>x.gid===t.gid).length;
      if(!confirm("Excluir todas as "+n+" ocorrências do grupo?"))break;
      S.tx.filter(x=>x.gid===t.gid).forEach(x=>{ if(x.goalId){ const g=goalOf(x.goalId); if(g&&g.moves)g.moves=g.moves.filter(mv=>mv.txId!==x.id); }});
      S.tx=S.tx.filter(x=>x.gid!==t.gid); save(); closeModal(); render(); toast("Grupo excluído"); break; }
    // cartões
    case "card-add": openCardForm(); break;
    case "card-open": openCardDetail(id); break;
    case "card-edit": openCardForm(id); break;
    case "card-delete": { const inUse=S.tx.some(t=>t.cardId===id);
      if(!confirm(inUse?"Cartão tem lançamentos. Excluir mesmo? (lançamentos ficam sem cartão)":"Excluir cartão?"))break;
      S.cards=S.cards.filter(c=>c.id!==id);
      S.tx.forEach(t=>{ if(t.cardId===id){ t.cardId=null; if(t.method==="cartao")t.method="boleto"; }});
      save(); closeModal(); render(); toast("Cartão excluído"); break; }
    case "pick-color": cardColor=el.dataset.c; document.querySelectorAll('[data-action="pick-color"]').forEach(b=>b.classList.toggle("on",b.dataset.c===cardColor)); break;
    // tickets
    case "ticket-add": openTicketForm(); break;
    case "ticket-open": openTicketDetail(id); break;
    case "ticket-edit": openTicketForm(id); break;
    case "ticket-delete": { const inUse=S.tx.some(t=>t.ticketId===id);
      if(!confirm(inUse?"Ticket tem gastos. Excluir mesmo?":"Excluir ticket?"))break;
      S.tickets=S.tickets.filter(t=>t.id!==id);
      S.tx.forEach(t=>{ if(t.ticketId===id){ t.ticketId=null; if(t.method==="ticket")t.method="debito"; }});
      save(); closeModal(); render(); toast("Ticket excluído"); break; }
    case "pick-tcolor": ticketColor=el.dataset.c; document.querySelectorAll('[data-action="pick-tcolor"]').forEach(b=>b.classList.toggle("on",b.dataset.c===ticketColor)); break;
    // poupança
    case "goal-add": openGoalForm(); break;
    case "goal-open": openGoalDetail(id); break;
    case "goal-edit": openGoalForm(id); break;
    case "goal-delete": { const g=goalOf(id);
      if(!confirm("Excluir a poupança \""+(g?g.name:"")+"\"? As movimentações serão perdidas."))break;
      S.goals=S.goals.filter(x=>x.id!==id);
      S.tx.forEach(t=>{ if(t.goalId===id)t.goalId=null; }); save(); closeModal(); render(); toast("Poupança excluída"); break; }
    case "goal-deposit": openMoveForm(id,"in"); break;
    case "goal-withdraw": openMoveForm(id,"out"); break;
    case "move-del": { const g=goalOf(el.dataset.gid); if(g&&g.moves){ g.moves=g.moves.filter(mv=>mv.id!==id); save(); openGoalDetail(el.dataset.gid); } break; }
    case "goal-launch-month": { const g=goalOf(id); if(!g)break;
      const due=viewMonth+"-"+String(new Date().getDate()).padStart(2,"0");
      createTx({type:"exp",dest:"savings",desc:"Poupança: "+g.name,cat:"Poupança",method:"transferencia",goalId:g.id,kind:"avista",total:g.monthly,firstDue:due});
      save(); render(); toast("Meta lançada em "+shortMonth(viewMonth)); break; }
    // conta
    case "acc-email": openAccEmail(); break;
    case "acc-pass": openAccPass(); break;
    case "acc-reset": try{ await sendPasswordResetEmail(auth,user.email); toast("Link enviado para "+user.email); }catch(err){ toast(authErr(err)); } break;
    case "acc-logout": if(confirm("Sair da conta?")) await signOut(auth); break;
    // categorias
    case "cat-add": { const nm=prompt("Nome da nova categoria:"); if(!nm)break;
      const arr=el.dataset.t==="inc"?S.incCats:S.expCats; if(!arr.includes(nm.trim()))arr.push(nm.trim());
      save(); render(); toast("Categoria criada"); break; }
    case "cat-del": { const cName=el.dataset.c;
      if(S.tx.some(t=>t.cat===cName)){ toast("Categoria em uso"); break; }
      if(el.dataset.t==="inc")S.incCats=S.incCats.filter(x=>x!==cName); else S.expCats=S.expCats.filter(x=>x!==cName);
      save(); render(); break; }
    // backup
    case "backup-export": exportBackup(); break;
    case "backup-import": $("#importFile").click(); break;
    case "csv-export": exportCSV(); break;
    // settings gear
    case "open-settings": tab="settings"; render(); break;
  }
  }catch(err){ console.error(err); toast("Ops, algo deu errado"); }
});

/* debounce busca */
let searchTimer=null;
document.addEventListener("input", e=>{
  if(e.target.id==="cmdInput"){ renderCmd(e.target.value); return; }
  if(e.target.id==="fltQ"){ clearTimeout(searchTimer);
    const val=e.target.value; searchTimer=setTimeout(()=>{ filters.q=val;
      // re-render mantendo foco
      render(); const inp=$("#fltQ"); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
    },250); }
});

document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="txMethod"){ syncAddForm(); autoDueFromCard(); }
  if(t.id==="edMethod"){ const isC=t.value==="cartao", isT=t.value==="ticket";
    if(isC&&!S.cards.length){ toast("Cadastre um cartão primeiro"); t.value="pix"; }
    else if(isT&&!S.tickets.length){ toast("Cadastre um ticket primeiro"); t.value="pix"; }
    const on=t.value==="cartao"||t.value==="ticket";
    if($("#edWrapWallet")) $("#edWrapWallet").classList.toggle("hidden",!on);
    if($("#edLblWallet")) $("#edLblWallet").textContent=t.value==="ticket"?"Ticket":"Cartão"; }
  if(t.id==="edKind"){ const f=$("#fEdit"); const tx=f&&S.tx.find(x=>x.id===f.dataset.id);
    if(tx){ const changed=t.value!==tx.kind;
      if($("#edWrapParc")) $("#edWrapParc").classList.toggle("hidden",!(changed&&t.value==="parcelado"));
      if($("#edWrapFixo")) $("#edWrapFixo").classList.toggle("hidden",!(changed&&t.value==="fixo"));
      if($("#edKindHelp")) $("#edKindHelp").classList.toggle("hidden",!changed); } }
  if(t.id==="txWallet"||t.id==="txBuy") autoDueFromCard();
  if(t.id==="fltCard"||t.dataset.role==="fcard"){ filters.card=t.value; render(); }
  if(t.id==="fltCat"||t.dataset.role==="fcat"){ filters.cat=t.value; render(); }
  if(t.id==="cdNoLimit"){ cardNoLimit=t.checked;
    $("#cdLimitWrap").classList.toggle("hidden",cardNoLimit);
    $("#cdCloseWrap").classList.toggle("hidden",cardNoLimit); }
  if(t.id==="txCat"&&t.value==="__new"){ const nm=prompt("Nome da nova categoria:");
    const arr=addType==="inc"?S.incCats:S.expCats; if(nm&&!arr.includes(nm.trim()))arr.push(nm.trim());
    save(); t.innerHTML=catOptions(addType,nm?nm.trim():undefined); }
  if(t.id==="edCat"&&t.value==="__new"){ const f=$("#fEdit"); const tx=S.tx.find(x=>x.id===f.dataset.id);
    const nm=prompt("Nome da nova categoria:"); const arr=tx.type==="inc"?S.incCats:S.expCats;
    if(nm&&!arr.includes(nm.trim()))arr.push(nm.trim());
    save(); t.innerHTML=catOptions(tx.type,nm?nm.trim():tx.cat); }
  if(t.id==="importFile"){ const f=t.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p.tx)throw 0;
        if(!confirm("Importar backup? Substitui os dados atuais."))return;
        S=Object.assign(defaultState(),p); S.cards=p.cards||[]; S.tickets=p.tickets||[]; S.goals=p.goals||[]; S.tx=p.tx||[];
        save(); updateAppName(); render(); toast("Backup importado ✓");
      }catch{ toast("Arquivo inválido"); } };
    r.readAsText(f); t.value=""; }
});

document.addEventListener("submit", async e=>{
  e.preventDefault(); const f=e.target;
  try{
  if(f.id==="authForm"){ const em=$("#authEmail").value.trim(), ps=$("#authPass").value; $("#authMsg").className="auth-msg";
    try{ if(authMode==="reg"){ if(ps!==$("#authPass2").value){ authMsg("As senhas não conferem."); return; }
        await createUserWithEmailAndPassword(auth,em,ps); }
      else await signInWithEmailAndPassword(auth,em,ps);
    }catch(err){ authMsg(authErr(err)); } }
  else if(f.id==="fTx") submitTx();
  else if(f.id==="fFatura"){ const cid=f.dataset.id; const dt=$("#ftDate").value||todayISO();
    let n=0; S.tx.forEach(t=>{ if(t.cardId===cid&&t.type==="exp"&&mkey(t.due)===viewMonth&&!t.paid){ applyPaid(t,dt,t.amount); n++; } });
    save(); closeModal(); openCardDetail(cid); render(); toast("Fatura paga ✓ ("+n+" lançamentos)"); }
  else if(f.id==="fPaid"){ const t=S.tx.find(x=>x.id===f.dataset.id); if(!t)return;
    applyPaid(t,$("#pdDate").value||todayISO(),parseMoney($("#pdAmt").value)||t.amount);
    save(); closeModal(); render(); toast(t.type==="inc"?"Recebido ✓":(t.dest==="savings"?"Guardado ✓":"Pago ✓")); }
  else if(f.id==="fEdit"){ const t=S.tx.find(x=>x.id===f.dataset.id); if(!t)return;
    const nDesc=$("#edDesc").value.trim()||t.desc;
    const nCat=($("#edCat")&&$("#edCat").value!=="__new")?$("#edCat").value:t.cat;
    const nVal=$("#edVal")?(parseMoney($("#edVal").value)||t.amount):t.amount;
    const nDue=$("#edDue").value||t.due;
    // resolve forma + cartão/ticket
    let nMethod=t.method,nCard=t.cardId,nTicket=t.ticketId;
    if($("#edMethod")){ const mv=$("#edMethod").value;
      if(mv==="cartao"||mv==="ticket"){ const wv=($("#edWallet")&&$("#edWallet").value)||"";
        if(wv.startsWith("card:")){ nMethod="cartao"; nCard=wv.slice(5); nTicket=null; }
        else if(wv.startsWith("ticket:")){ nMethod="ticket"; nTicket=wv.slice(7); nCard=null; }
        else { nMethod=mv; }
      } else { nMethod=mv; nCard=null; nTicket=null; } }
    // mudou o tipo? recria o grupo inteiro
    if($("#edKind")&&$("#edKind").value!==t.kind){
      const nk=$("#edKind").value; const gid=t.gid; const old=S.tx.filter(x=>x.gid===gid);
      if(!confirm("Mudar o tipo recria o grupo ("+old.length+" lançamento(s)) a partir de "+nDue.split("-").reverse().join("/")+", usando "+fmt(nVal)+" como valor total. Pagamentos do grupo serão desfeitos. Continuar?")) return;
      old.forEach(x=>{ if(x.paid) undoPaid(x); });
      S.tx=S.tx.filter(x=>x.gid!==gid);
      createTx({ type:t.type, dest:null, desc:nDesc, cat:nCat, method:nMethod, cardId:nCard, ticketId:nTicket, goalId:null,
        comp:(t.type==="inc"&&$("#edComp")&&$("#edComp").value)?$("#edComp").value:null,
        kind:nk, total:nVal, n:Math.max(2,parseInt($("#edN")&&$("#edN").value)||2),
        paidCount:Math.max(0,parseInt($("#edPaidN")&&$("#edPaidN").value)||0),
        months:Math.max(2,parseInt($("#edMonths")&&$("#edMonths").value)||12),
        firstDue:nDue, alreadyPaid:false });
      save(); closeModal(); render(); toast("Tipo alterado — grupo recriado ✓"); return; }
    t.desc=nDesc; if($("#edCat")) t.cat=nCat; if($("#edVal")) t.amount=nVal; t.due=nDue;
    t.method=nMethod; t.cardId=nCard; t.ticketId=nTicket;
    if($("#edComp")) t.comp=$("#edComp").value||null;
    if(t.paid&&$("#edPayDate")){ t.payDate=$("#edPayDate").value; t.payAmt=parseMoney($("#edPayAmt").value)||t.amount;
      if(t.dest==="savings"&&t.goalId){ const g=goalOf(t.goalId); if(g&&g.moves){ const mv=g.moves.find(m=>m.txId===t.id); if(mv){ mv.date=t.payDate; mv.amount=t.payAmt; } } } }
    if($("#edApplyAll")&&$("#edApplyAll").checked){ S.tx.forEach(x=>{ if(x.gid===t.gid){ x.desc=t.desc; x.cat=t.cat; x.method=t.method; x.cardId=t.cardId; x.ticketId=t.ticketId; } }); }
    save(); closeModal(); render(); toast("Alterações salvas ✓"); }
  else if(f.id==="fCard"){ const noLimit=$("#cdNoLimit").checked;
    const data={ bank:$("#cdBank").value, nick:$("#cdNick").value.trim()||"Meu cartão", color:cardColor, noLimit,
      limit:noLimit?0:parseMoney($("#cdLimit").value),
      closeDay:noLimit?1:Math.min(31,Math.max(1,parseInt($("#cdClose").value)||1)),
      dueDay:Math.min(31,Math.max(1,parseInt($("#cdDue").value)||10)) };
    if(f.dataset.id){ Object.assign(cardOf(f.dataset.id),data); toast("Cartão atualizado ✓"); }
    else { S.cards.push(Object.assign({id:uid()},data)); toast("Cartão adicionado ✓"); }
    save(); closeModal(); render(); }
  else if(f.id==="fTicket"){ const data={ brand:$("#tkBrand").value, name:$("#tkName").value.trim()||"Ticket",
      color:ticketColor, monthly:parseMoney($("#tkMonthly").value), day:Math.min(31,Math.max(1,parseInt($("#tkDay").value)||1)) };
    if(f.dataset.id){ Object.assign(ticketOf(f.dataset.id),data); toast("Ticket atualizado ✓"); }
    else { S.tickets.push(Object.assign({id:uid(),overrides:{}},data)); toast("Ticket adicionado ✓"); }
    save(); closeModal(); render(); }
  else if(f.id==="fTicketMonth"){ const tk=ticketOf(f.dataset.id); if(!tk)return;
    tk.overrides=tk.overrides||{}; tk.overrides[viewMonth]=parseMoney($("#tkMonthVal").value);
    save(); openTicketDetail(f.dataset.id); render(); toast("Recarga do mês ajustada ✓"); }
  else if(f.id==="fGoal"){ const data={ name:$("#glName").value.trim()||"Poupança", bank:$("#glBank").value.trim(),
      color:goalColor, goal:parseMoney($("#glGoal").value), monthly:parseMoney($("#glMonthly").value),
      cdi:parseFloat(String($("#glCdi").value).replace(",","."))||0, showHome:$("#glShowHome").checked };
    if(f.dataset.id){ Object.assign(goalOf(f.dataset.id),data); toast("Poupança atualizada ✓"); }
    else { S.goals.push(Object.assign({id:uid(),moves:[]},data)); toast("Poupança criada ✓"); }
    save(); closeModal(); render(); }
  else if(f.id==="fMove"){ const g=goalOf(f.dataset.id); if(!g)return;
    const v=parseMoney($("#mvAmt").value); if(v<=0){ toast("Valor inválido"); return; }
    g.moves=g.moves||[]; g.moves.push({id:uid(),date:$("#mvDate").value||todayISO(),amount:v,kind:f.dataset.kind});
    save(); openGoalDetail(f.dataset.id); render(); toast(f.dataset.kind==="out"?"Retirada registrada ✓":"Depósito registrado ✓"); }
  else if(f.id==="fAppName"){ S.appName=$("#inAppName").value.trim()||"WIGO"; updateAppName(); save(); toast("Nome salvo ✓"); }
  else if(f.id==="fCdi"){ S.cdiRef=(parseFloat(String($("#inCdi").value).replace(",","."))||14.65)/100; save(); render(); toast("CDI atualizado ✓"); }
  else if(f.id==="fEmail"){ try{ await reauth($("#accPass").value);
      await verifyBeforeUpdateEmail(user,$("#accNewEmail").value.trim()); closeModal(); toast("Confirmação enviada ao novo e-mail"); }
    catch(err){ toast(authErr(err)); } }
  else if(f.id==="fPass"){ if($("#accNewPass").value!==$("#accNewPass2").value){ toast("As senhas não conferem"); return; }
    try{ await reauth($("#accPass").value); await updatePassword(user,$("#accNewPass").value); closeModal(); toast("Senha atualizada ✓"); }
    catch(err){ toast(authErr(err)); } }
  }catch(err){ console.error(err); toast("Ops, algo deu errado"); }
});

$("#sheetWrap").addEventListener("click",e=>{ if(e.target.id==="sheetWrap") closeModal(); });
$("#cmdWrap").addEventListener("click",e=>{ if(e.target.id==="cmdWrap") closeCmd(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeCmd(); closeModal(); }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); }
});

/* atalho: clicar no nome do app abre ajustes */
$("#appNameEl").addEventListener("click",()=>{ tab="settings"; render(); });
