/* ══════════════════ MOTOR DE INSIGHTS ══════════════════ */
function buildInsights(){
  const out=[]; const A=lastMonths(7); const cur=A[6], prev=A[5];
  const past=A.slice(0,6).filter(a=>a.exp>0);
  const avg=past.length?past.reduce((s,a)=>s+a.exp,0)/past.length:0;

  if(prev.exp>0&&cur.exp>0){ const p=pctDelta(cur.exp,prev.exp);
    if(Math.abs(p)>=5) out.push({k:p<0?"up":"down",ic:p<0?ic("trendDown"):ic("trendUp"),
      t:(p<0?"Você gastou "+Math.abs(p)+"% menos":"Seus gastos subiram "+p+"%"),
      b:"Em "+shortMonth(cur.mk)+" você gastou "+fmt(cur.exp)+" contra "+fmt(prev.exp)+" em "+shortMonth(prev.mk)+"."}); }

  if(cur.inc>0){ const cob=Math.round(cur.exp/cur.inc*100);
    out.push({k:cob<=85?"up":cob<=100?"warn":"down",ic:cob<=85?ic("shield"):cob<=100?ic("scale"):ic("alert"),
      t:cob<=100?"Sua renda cobre os gastos":"Sua renda não cobre os gastos",
      b:"Os gastos consomem "+cob+"% da renda de "+shortMonth(cur.mk)+
        (cob<=100?". Sobram "+fmt(cur.inc-cur.exp)+".":". Faltam "+fmt(cur.exp-cur.inc)+".")}); }

  // maior variação por categoria
  const cc={},pc={};
  txEffMonth(cur.mk).forEach(t=>{ if(t.type==="exp"&&t.dest!=="savings") cc[t.cat]=(cc[t.cat]||0)+val(t); });
  txEffMonth(prev.mk).forEach(t=>{ if(t.type==="exp"&&t.dest!=="savings") pc[t.cat]=(pc[t.cat]||0)+val(t); });
  let bigCat=null;
  Object.keys(cc).forEach(c=>{ if(!pc[c])return; const d=pctDelta(cc[c],pc[c]);
    if(d!=null&&Math.abs(d)>=12&&(!bigCat||Math.abs(d)>Math.abs(bigCat.d))) bigCat={c,d,now:cc[c]}; });
  if(bigCat) out.push({k:bigCat.d<0?"up":"warn",ic:catIcon(bigCat.c),
    t:esc(bigCat.c)+(bigCat.d<0?" caiu "+Math.abs(bigCat.d)+"%":" subiu "+bigCat.d+"%"),
    b:"Você gastou "+fmt(bigCat.now)+" nesta categoria em "+shortMonth(cur.mk)+"."});

  // vencimentos próximos
  const soon=aTx().filter(t=>!t.paid&&daysTo(t.due)>=0&&daysTo(t.due)<=5).sort((a,b)=>a.due<b.due?-1:1);
  if(soon.length){ const f=soon[0]; const d=daysTo(f.due);
    out.push({k:"warn",ic:ic("clock"),t:d===0?"Vence hoje":d===1?"Vence amanhã":"Vence em "+d+" dias",
      b:esc(f.desc)+" · "+fmt(f.amount)+(soon.length>1?" · e mais "+(soon.length-1)+" nos próximos dias.":".")}); }

  // ritmo do mês
  if(cur.mk===mkey(todayISO())){ const d=new Date(), dia=d.getDate(),
      dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    const pago=sum(txEffMonth(cur.mk).filter(t=>t.type==="exp"&&t.dest!=="savings"&&t.paid),t=>t.payAmt??t.amount);
    if(dia>=4&&pago>0){ const proj=pago/dia*dim;
      out.push({k:avg&&proj>avg?"warn":"info",ic:ic("target"),t:"Projeção do mês: "+fmt(proj),
        b:"No ritmo de "+fmt(pago/dia)+"/dia"+(avg?", "+(proj>avg?"acima":"abaixo")+" da sua média de "+fmt(avg)+".":".")}); } }

  // economia potencial anual
  if(cur.inc>0&&cur.inc>cur.exp){ const s=cur.inc-cur.exp;
    out.push({k:"up",ic:ic("rocket"),t:"Pode guardar "+fmt(s)+" este mês",
      b:"Mantendo esse ritmo, seriam cerca de "+fmt(s*12)+" em 12 meses."}); }

  // fatura de cartão
  S.cards.forEach(c=>{ if(c.noLimit)return; const d=daysTo(mkey(todayISO())+"-"+String(c.dueDay).padStart(2,"0"));
    const fat=sum(aTx().filter(t=>t.cardId===c.id&&t.type==="exp"&&mkey(t.due)===mkey(todayISO())&&!t.paid));
    if(d>=0&&d<=6&&fat>0) out.push({k:"warn",ic:ic("card"),t:"Fatura "+esc(c.nick)+" vence em "+d+" dia"+(d===1?"":"s"),
      b:"Valor em aberto: "+fmt(fat)+"."}); });

  // uso de limite
  S.cards.forEach(c=>{ if(c.noLimit||!c.limit)return; const u=cardUsed(c), p=Math.round(u/c.limit*100);
    if(p>=80) out.push({k:p>=95?"down":"warn",ic:ic("alert"),t:esc(c.nick)+" com "+p+"% do limite",
      b:"Usado "+fmt(u)+" de "+fmt(c.limit)+". Disponível: "+fmt(Math.max(0,c.limit-u))+"."}); });

  // metas
  S.goals.forEach(g=>{ if(!g.goal)return; const b=goalBalance(g), p=Math.round(b/g.goal*100);
    if(p>=100) out.push({k:"up",ic:ic("trophy"),t:"Meta “"+esc(g.name)+"” concluída!",b:"Você alcançou "+fmt(b)+". Parabéns!"});
    else if(p>=75) out.push({k:"up",ic:ic("target"),t:esc(g.name)+" em "+p+"%",b:"Faltam "+fmt(g.goal-b)+" para concluir."}); });

  return out.slice(0,7);
}
function insightStrip(){
  const ins=buildInsights();
  if(!ins.length) return "";
  return '<div class="sec-head" style="margin:0 20px 10px"><h2>Para você</h2><span class="faint" style="font-size:11.5px">'+ins.length+' insights</span></div>'+
    '<div class="ins-scroll">'+ins.map(i=>'<div class="ins '+i.k+'"><span class="ic">'+i.ic+'</span>'+
      '<div class="tt">'+i.t+'</div><div class="bd">'+i.b+'</div></div>').join("")+'</div>';
}

/* ══════════════════ INÍCIO — cockpit ══════════════════ */
function renderHome(){
  const m=txEffMonth(viewMonth);
  const incPaid=sum(m.filter(t=>t.type==="inc"&&t.paid),t=>t.payAmt??t.amount);
  const incOpen=sum(m.filter(t=>t.type==="inc"&&!t.paid));
  const expL=m.filter(t=>t.type==="exp"&&t.dest!=="savings");
  const expPaid=sum(expL.filter(t=>t.paid),t=>t.payAmt??t.amount);
  const expOpen=sum(expL.filter(t=>!t.paid));
  const popL=m.filter(t=>t.dest==="savings");
  const popDone=sum(popL.filter(t=>t.paid),t=>t.payAmt??t.amount);
  const incT=incPaid+incOpen, expT=expPaid+expOpen;
  const saldo=incT-expT-sum(popL);
  const disp=incPaid-expPaid-popDone;
  const late=aTx().filter(t=>!t.paid&&statusOf(t)==="atrasado");
  const soon=aTx().filter(t=>!t.paid&&statusOf(t)==="proximo"&&daysTo(t.due)<=3);
  const prev=monthAgg(addMonthsISO(viewMonth+"-01",-1).slice(0,7));
  const patr=S.goals.reduce((a,g)=>a+goalBalance(g),0);

  /* --- HERO: extrato de caixa do mês ---
     O número em destaque é o SALDO ATUAL, o que existe em caixa agora — é ele
     que se compara com o app do banco. Acima dele, de onde partiu; abaixo, o
     que ainda falta acontecer até fechar o mês. */
  const cx=cashFlow(viewMonth);
  const tot=Math.max(1,incT+expT);
  const hero='<div class="hero" data-tour="ledger">'+
    '<div class="cap">'+(cx.fechado?"Saldo ao fim de":"Saldo atual ·")+
      ' <span style="text-transform:capitalize">'+monthLabel(viewMonth)+'</span></div>'+
    '<div class="big '+(cx.atual>=0?"":"down")+'">'+fmt(cx.atual)+'</div>'+
    (cx.semAbertura
      ? '<div class="sub"><span class="open-warn" data-action="open-set">'+ic("alert")+
        ' Informe seu saldo de abertura para bater com o banco</span></div>'
      : '<div class="sub">'+deltaChip(pctDelta(incT-expT,prev.inc-prev.exp))+
        '<span>'+(cx.fechado
          ? 'Foi com isso que '+shortMonth(addMonthsISO(viewMonth+"-01",1).slice(0,7))+' começou'
          : 'Fecha o mês em <b style="color:#fff">'+fmt(cx.final)+'</b>')+'</span></div>')+

    /* mês encerrado mostra o que de fato aconteceu; o pendente aparece como
       nota, não somado, porque aquele dinheiro nunca saiu naquele mês */
    '<div class="ledger">'+
      '<div class="lg"><span>Saldo inicial</span><b>'+fmt(cx.inicial)+'</b></div>'+
      '<div class="lg" data-action="home-filter" data-mode="recebido"><span>+ Recebido</span><b class="up">'+fmt(cx.entrou)+'</b></div>'+
      '<div class="lg" data-action="home-filter" data-mode="pago"><span>− Pago</span><b class="down">'+fmt(cx.saiu)+'</b></div>'+
      (cx.fechado
        ? '<div class="lg end"><span>= Saldo final</span><b class="'+(cx.final>=0?"":"down")+'">'+fmt(cx.final)+'</b></div>'+
          ((cx.aReceber||cx.aPagar)
            ? '<div class="lg nota"><span>Ficou pendente</span><b>'+
              (cx.aReceber?'<span class="up">+'+fmt(cx.aReceber)+'</span> ':"")+
              (cx.aPagar?'<span class="down">−'+fmt(cx.aPagar)+'</span>':"")+'</b></div>'
            : "")
        : '<div class="lg now"><span>= Saldo atual</span><b>'+fmt(cx.atual)+'</b></div>'+
          (cx.aReceber?'<div class="lg" data-action="home-filter" data-mode="areceber"><span>+ A receber</span><b class="up">'+fmt(cx.aReceber)+'</b></div>':"")+
          (cx.aPagar?'<div class="lg" data-action="home-filter" data-mode="apagar"><span>− A pagar'+
            (cx.atrasado?' <i class="lt">'+fmt(cx.atrasado)+' vencido</i>':"")+'</span><b class="down">'+fmt(cx.aPagar)+'</b></div>':"")+
          '<div class="lg end"><span>= Saldo final previsto</span><b class="'+(cx.final>=0?"":"down")+'">'+fmt(cx.final)+'</b></div>')+
    '</div>'+

    '<div class="flowbar"><i style="width:'+(incT/tot*100)+'%;background:linear-gradient(90deg,#00E5A8,#00b98a)"></i>'+
      '<i style="width:'+(expT/tot*100)+'%;background:linear-gradient(90deg,#FF5C7A,#e0405f)"></i></div>'+
    '</div>';

  /* --- alertas --- */
  let alerts="";
  if(late.length) alerts+='<div class="alert d" data-action="home-filter" data-mode="atraso">'+
    '<span class="ic">'+ic("alert")+'</span><span class="tx"><b>'+late.length+' em atraso</b> · '+fmt(sum(late))+'</span><span class="go">›</span></div>';
  if(soon.length) alerts+='<div class="alert w" data-action="home-filter" data-mode="proximo">'+
    '<span class="ic">'+ic("clock")+'</span><span class="tx"><b>'+soon.length+' vence(m) em até 3 dias</b> · '+fmt(sum(soon))+'</span><span class="go">›</span></div>';

  /* --- métricas --- */
  const metrics='<div class="sec"><div class="grid g2 stagger">'+
    '<div class="metric tap" data-action="home-filter" data-mode="guardado"><div class="k">'+ic("piggy")+' Guardado no mês</div>'+
      '<div class="v info">'+fmt(popDone)+'</div><div class="s">'+popL.length+' aporte(s)</div></div>'+
    '<div class="metric tap" data-action="tab" data-v="savings"><div class="k">'+ic("gem")+' Patrimônio</div>'+
      '<div class="v vio">'+fmt(patr)+'</div><div class="s">'+S.goals.length+' meta(s)</div></div>'+
    '</div></div>';

  /* --- cartões (mini) --- */
  let cardStrip="";
  if(S.cards.length){
    cardStrip='<div class="sec-head" style="margin:0 20px 10px"><h2>Seus cartões</h2>'+
      '<span class="more" data-action="tab" data-v="cards">Ver todos ›</span></div>'+
      '<div class="cstack">'+S.cards.map(cardFace).join("")+'</div>';
  }

  /* --- onde vai o dinheiro --- */
  const by={}; expL.forEach(t=>{ by[t.cat]=(by[t.cat]||0)+val(t); });
  const byE=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const donutBox=byE.length?'<div class="sec"><div class="surface" style="padding:20px">'+
    '<div class="sec-head" style="margin:0 0 16px"><h2>Para onde vai</h2><span class="faint" style="font-size:11.5px">'+shortMonth(viewMonth)+'</span></div>'+
    donut(byE,expT)+'</div></div>':"";

  /* --- lista --- */
  if(homeFlt){
    let src,lbl;
    const L={atraso:"Em atraso · todos os meses",proximo:"Vencendo em até 3 dias",
      recebido:"Recebido em "+shortMonth(viewMonth),pago:"Pago em "+shortMonth(viewMonth),
      guardado:"Guardado em "+shortMonth(viewMonth),
      areceber:"A receber até o fim de "+shortMonth(viewMonth),
      apagar:"A pagar até o fim de "+shortMonth(viewMonth)};
    if(homeFlt==="atraso") src=aTx().filter(t=>!t.paid&&statusOf(t)==="atrasado");
    else if(homeFlt==="proximo") src=aTx().filter(t=>!t.paid&&statusOf(t)==="proximo"&&daysTo(t.due)<=3);
    /* recebido/pago seguem o CAIXA: o que se moveu neste mês, pela data de
       pagamento — por isso cashMonth e não o mês de competência */
    else if(homeFlt==="recebido") src=aTx().filter(t=>t.type==="inc"&&cashMonth(t)===viewMonth);
    else if(homeFlt==="pago") src=aTx().filter(t=>t.type!=="inc"&&cashMonth(t)===viewMonth);
    else if(homeFlt==="areceber") src=cashPending(viewMonth).filter(t=>t.type==="inc");
    else if(homeFlt==="apagar") src=cashPending(viewMonth).filter(t=>t.type!=="inc");
    else if(homeFlt==="guardado") src=popL;
    else src=m;
    src=src.slice().sort((a,b)=>a.due<b.due?-1:1); curListIds=src.map(t=>t.id);
    lbl=L[homeFlt]||"Lançamentos";
    return '<div class="appbar-pad"></div>'+mpick()+
      '<div class="sec"><div class="sec-head"><h2>'+lbl+'</h2>'+
        '<span class="more" data-action="home-filter-clear">✕ ver tudo</span></div>'+
      '<div class="surface" style="padding:6px 0">'+
        (src.length?'<div style="padding:10px 20px 4px"><button class="btn xs ghost" data-action="sel-all">'+
          (src.length&&src.every(t=>selTx.has(t.id))?ic("x")+" Desmarcar todos":ic("checkSquare")+" Selecionar todos")+'</button></div>':"")+
        rowsList(src)+'</div></div>';
  }

  /* a lista pode olhar só o mês exibido ou o histórico inteiro.
     Os totais do topo continuam sempre presos ao mês — só a lista muda. */
  const base=filters.scope==="all"?aTx():m;
  const filtered=base.filter(passFilter).sort((a,b)=>a.due<b.due?1:-1);
  curListIds=filtered.map(t=>t.id);
  const allSel=filtered.length&&filtered.every(t=>selTx.has(t.id));
  const somaF=filtered.length&&filterActive()
    ? '<span class="faint" style="font-size:11.5px">'+filtered.length+' de '+base.length+
      ' · <b style="color:var(--ink-2)">'+fmt(sum(filtered.filter(t=>t.type!=="inc"),val))+'</b> saídas · '+
      '<b style="color:var(--ink-2)">'+fmt(sum(filtered.filter(t=>t.type==="inc"),val))+'</b> entradas</span>'
    : '<span class="faint" style="font-size:11.5px">'+filtered.length+' de '+base.length+'</span>';
  const listBox='<div class="sec"><div class="sec-head"><h2>Lançamentos</h2>'+somaF+'</div>'+
    filterBar(base)+
    '<div class="surface" style="padding:6px 0">'+
      (filtered.length?'<div style="padding:10px 20px 4px;display:flex;gap:8px">'+
        '<button class="btn xs ghost" data-action="sel-all">'+(allSel?ic("x")+" Desmarcar todos":ic("checkSquare")+" Selecionar todos")+'</button>'+
        (filterActive()?'<button class="btn xs ghost" data-action="flt-clear">Limpar filtros</button>':"")+'</div>':"")+
      rowsList(filtered,'Toque no + para criar seu primeiro lançamento.')+'</div></div>';

  return mpick()+alerts+hero+insightStrip()+metrics+cardStrip+donutBox+listBox;
}

/* ---------- donut ---------- */
function donut(entries,total){
  const R=54,C=2*Math.PI*R; let off=0;
  const segs=entries.slice(0,8).map(([n,v],i)=>{
    const len=total?v/total*C:0; const s='<circle cx="66" cy="66" r="'+R+'" stroke="'+DONUT_COLORS[i%8]+
      '" stroke-width="15" fill="none" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" stroke-linecap="butt"/>';
    off+=len; return s; }).join("");
  const leg=entries.slice(0,8).map(([n,v],i)=>'<div class="leg" data-action="cat-detail" data-cat="'+esc(n)+'">'+
    '<i class="sw" style="background:'+DONUT_COLORS[i%8]+'"></i>'+
    '<span class="n">'+catIcon(n)+" "+esc(n)+'</span><span class="v">'+fmt(v)+'</span></div>').join("");
  return '<div class="donut-wrap"><div class="donut">'+
    '<svg width="132" height="132" viewBox="0 0 132 132">'+
      '<circle cx="66" cy="66" r="'+R+'" stroke="rgba(255,255,255,.05)" stroke-width="15" fill="none"/>'+segs+'</svg>'+
    '<div class="mid"><div class="v">'+fmt(total)+'</div><div class="k">no mês</div></div></div>'+
    '<div class="legend">'+leg+'</div></div>';
}

/* ══════════════════ CARTEIRA ══════════════════ */
/* faturas marcadas na aba Carteira — some ao trocar de mês, porque a soma
   sempre se refere às faturas do mês exibido */
let selCards=new Set();
function cardFatura(c){ return sum(aTx().filter(t=>t.cardId===c.id&&t.type==="exp"&&mkey(t.due)===viewMonth)); }
function cardPick(c){
  return '<button class="cpick'+(selCards.has(c.id)?" on":"")+'" data-action="card-pick" data-id="'+c.id+'" '+
    'aria-label="Selecionar fatura de '+esc(c.nick)+'">'+ic("check")+'</button>';
}
/* painel com a soma das faturas marcadas */
function cardPickSum(){
  selCards.forEach(id=>{ if(!cardOf(id)) selCards.delete(id); });
  if(!selCards.size) return "";
  const sel=S.cards.filter(c=>selCards.has(c.id));
  const total=sel.reduce((a,c)=>a+cardFatura(c),0);
  const aberto=sel.reduce((a,c)=>a+sum(aTx().filter(t=>t.cardId===c.id&&t.type==="exp"&&mkey(t.due)===viewMonth&&!t.paid)),0);
  return '<div class="sec"><div class="stat picked-sum">'+
    '<div class="k">'+sel.length+' fatura'+(sel.length>1?"s":"")+' de '+shortMonth(viewMonth)+
      ' <button class="lnk" data-action="card-pick-clear">limpar</button></div>'+
    '<div class="v violet">'+fmt(total)+'</div>'+
    '<div class="s">'+(aberto>0?"em aberto "+fmt(aberto)+" · já pago "+fmt(total-aberto):"tudo pago")+'</div>'+
    '<div class="picked-list">'+sel.map(c=>'<div><span>'+esc(c.nick)+'</span><b>'+fmt(cardFatura(c))+'</b></div>').join("")+'</div>'+
  '</div></div>';
}
function cardFace(c){
  const fat=cardFatura(c);
  const bg='linear-gradient(140deg,'+c.color+' 0%,'+c.color+'cc 45%,#0A0A0F 145%)';
  if(c.noLimit) return '<div class="ccard'+(selCards.has(c.id)?" picked":"")+'" style="background:'+bg+'" data-action="card-open" data-id="'+c.id+'">'+
    cardPick(c)+
    '<div class="top"><div><div class="bank">'+esc(c.bank).toUpperCase()+'</div><div class="nick">'+esc(c.nick)+'</div></div>'+
      '<div class="brand">3º</div></div>'+
    '<div><div class="dig">•••• ••••</div>'+
      '<div class="lim" style="margin-top:8px"><div><div style="font-size:10px;opacity:.7">FATURA '+shortMonth(viewMonth).toUpperCase()+'</div>'+
        '<div class="u">'+fmt(fat)+'</div></div><div class="a">sem limite<br>vence dia '+c.dueDay+'</div></div></div></div>';
  const used=cardUsed(c), pct=c.limit?Math.min(100,used/c.limit*100):0, over=used>c.limit;
  return '<div class="ccard'+(over?" over":"")+(selCards.has(c.id)?" picked":"")+'" style="background:'+bg+'" data-action="card-open" data-id="'+c.id+'">'+
    cardPick(c)+

      '<div class="brand">'+esc(c.bank).slice(0,2).toUpperCase()+'</div></div>'+
    '<div><div class="lim"><div><div style="font-size:10px;opacity:.7">UTILIZADO</div><div class="u">'+fmt(used)+'</div></div>'+
      '<div class="a">disponível<br><b>'+fmt(Math.max(0,c.limit-used))+'</b></div></div>'+
      '<div class="track"><i style="width:'+pct+'%"></i></div>'+
      '<div class="due">Fatura '+shortMonth(viewMonth)+': '+fmt(fat)+' · fecha '+c.closeDay+' · vence '+c.dueDay+'</div></div></div>';

        '<div class="v down">'+fmt(devo)+'</div><div class="s">'+comSaldo.filter(f=>f.saldo<0).length+' pessoa(s)</div></div>'+

  html+='<div class="sec"><button class="btn ghost" data-action="pes-add">'+ic("plus")+' Adicionar pessoa</button></div>';

}

function renderSavings(){
  const saved=S.goals.reduce((a,g)=>a+goalBalance(g),0);
  const target=S.goals.reduce((a,g)=>a+(g.goal||0),0);
  const donev=S.goals.filter(g=>g.goal&&goalBalance(g)>=g.goal).length;
  const pctAll=target?Math.min(100,saved/target*100):0;

  let head='<div class="sec"><div class="hero" style="margin:0">'+
    '<div class="cap">Patrimônio guardado</div>'+
    '<div class="big">'+fmt(saved)+'</div>'+
    '<div class="sub"><span>de '+fmt(target)+' em metas</span>'+
      (donev?'<span class="delta up">'+ic("trophy")+' '+donev+' concluída(s)</span>':"")+'</div>'+
    '<div class="flowbar"><i style="width:'+pctAll+'%;background:linear-gradient(90deg,#00E5A8,#8B5CFF)"></i></div>'+
    '</div></div>';

  let list;
  if(!S.goals.length) list='<div class="empty"><div class="e-ic">'+ic("piggy")+'</div><div class="e-t">Nenhuma meta ainda</div>Crie um objetivo: reserva de emergência, viagem, entrada do apê…</div>';
  else list='<div class="sec stagger">'+S.goals.map(g=>{
    const bal=goalBalance(g), pct=g.goal?Math.min(100,bal/g.goal*100):0, ok=pct>=100;
    const y=goalYield(g);
    const falta=Math.max(0,(g.goal||0)-bal);
    const mAvg=(g.moves||[]).length?bal/Math.max(1,new Set((g.moves||[]).map(mv=>mkey(mv.date))).size):0;
    const eta=(!ok&&falta>0&&mAvg>0)?Math.ceil(falta/mAvg):null;
    return '<div class="goal'+(ok?" done":"")+'" data-action="goal-open" data-id="'+g.id+'">'+
      '<div class="gh"><div class="gi">'+(ok?ic("trophy"):ic("target"))+'</div>'+
        '<div class="gn"><div class="t">'+esc(g.name)+'</div>'+
          '<div class="s">'+(g.bank?esc(g.bank):"conta não informada")+(g.cdi>0?" · "+g.cdi+"% CDI":"")+'</div></div>'+
        '<div class="pct '+(ok?"up":"vio")+'">'+pct.toFixed(0)+'%</div></div>'+
      '<div class="ring'+(ok?" ok":"")+'"><i style="width:'+pct+'%"></i></div>'+
      '<div class="gf"><span>'+fmt(bal)+' de '+fmt(g.goal)+'</span>'+
        '<span>'+(ok?"Meta batida!":(eta?"~"+eta+" mês(es) no ritmo atual":"faltam "+fmt(falta)))+'</span></div>'+
      (g.cdi>0?'<div class="gf" style="margin-top:4px"><span class="faint">rende ~'+fmt(y.monthly)+'/mês</span>'+
        '<span class="faint">'+fmt(y.yearly)+'/ano</span></div>':"")+
      '</div>';
  }).join("")+'</div>';

  return head+list+'<div class="sec"><button class="btn ghost" data-action="goal-add">+ Nova meta</button>'+
    '<div class="help">'+ic("bulb")+' O rendimento é uma <b>estimativa</b> com base no CDI de referência ('+((S.cdiRef||CDI_ANUAL)*100).toFixed(2)+'% a.a.). Valores reais dependem do banco e de impostos.</div></div>';
}

/* ══════════════════ ANÁLISE ══════════════════ */
function bars(entries,total,cls){
  if(!entries.length) return '<div class="empty">Nada neste período.</div>';
  const mx=Math.max(...entries.map(e=>e[1]))||1;
  return entries.map(([n,v])=>'<div class="barline"><div class="bh"><div class="n"><span>'+esc(n)+'</span></div>'+
    '<div class="v">'+fmt(v)+'</div></div>'+
    '<div class="track'+(cls==="green"?" g":"")+'"><i style="width:'+(v/mx*100)+'%"></i></div></div>').join("");
}
function renderReport(){
  const mAll=txEffMonth(viewMonth);
  const m=mAll.filter(passFilter);
  curListIds=m.map(t=>t.id);
  const paid=m.filter(t=>t.paid), late=m.filter(t=>!t.paid&&statusOf(t)==="atrasado"),
        open=m.filter(t=>!t.paid&&statusOf(t)!=="atrasado");

  /* tendência 12 meses */
  const A=lastMonths(12); const mx=Math.max(1,...A.map(a=>Math.max(a.inc,a.exp)));
  const trend='<div class="sec"><div class="surface" style="padding:20px">'+
    '<div class="sec-head" style="margin:0 0 8px"><h2>Tendência</h2><span class="faint" style="font-size:11.5px">12 meses</span></div>'+
    '<div class="trend">'+A.map(a=>'<div class="tcol'+(a.mk===viewMonth?" on":"")+'" data-action="month-detail" data-mk="'+a.mk+'">'+
      '<div class="tbars"><i class="tb i" style="height:'+Math.max(3,a.inc/mx*84)+'px"></i>'+
        '<i class="tb e" style="height:'+Math.max(3,a.exp/mx*84)+'px"></i></div>'+
      '<div class="lb">'+shortMonth(a.mk)+'</div></div>').join("")+'</div>'+
    '<div class="heat-k"><i style="background:#00E5A8"></i>entradas <i style="background:#FF5C7A;margin-left:8px"></i>saídas</div>'+
    '</div></div>';

  /* comparação */
  const cur=A[11], prv=A[10];
  const withE=A.filter(a=>a.exp>0);
  const hi=withE.length?withE.reduce((a,b)=>b.exp>a.exp?b:a):null;
  const lo=withE.length?withE.reduce((a,b)=>b.exp<a.exp?b:a):null;
  const cmp='<div class="sec"><div class="grid g2 stagger">'+
    '<div class="metric"><div class="k">'+ic("trendDown")+' Gastos vs '+shortMonth(prv.mk)+'</div>'+
      '<div class="v">'+deltaChip(pctDelta(cur.exp,prv.exp),true)+'</div>'+
      '<div class="s">'+fmt(cur.exp)+' × '+fmt(prv.exp)+'</div></div>'+
    '<div class="metric"><div class="k">'+ic("trendUp")+' Receitas vs '+shortMonth(prv.mk)+'</div>'+
      '<div class="v">'+deltaChip(pctDelta(cur.inc,prv.inc))+'</div>'+
      '<div class="s">'+fmt(cur.inc)+' × '+fmt(prv.inc)+'</div></div></div>'+
    (hi?'<div class="help">Nos últimos 12 meses: maior gasto em <b style="text-transform:capitalize">'+shortMonth(hi.mk)+
      '</b> ('+fmt(hi.exp)+') · menor em <b style="text-transform:capitalize">'+shortMonth(lo.mk)+'</b> ('+fmt(lo.exp)+')</div>':"")+'</div>';

  /* projeção */
  let proj="";
  if(viewMonth===mkey(todayISO())){
    const pago=sum(mAll.filter(t=>t.type==="exp"&&t.dest!=="savings"&&t.paid),t=>t.payAmt??t.amount);
    const aberto=sum(mAll.filter(t=>t.type==="exp"&&t.dest!=="savings"&&!t.paid));
    const renda=sum(mAll.filter(t=>t.type==="inc"),val);
    const d=new Date(), dia=d.getDate(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    const ritmo=dia?pago/dia*dim:0, total=Math.max(pago+aberto,ritmo), sobra=renda-total;
    proj='<div class="sec"><div class="surface" style="padding:20px">'+
      '<div class="sec-head" style="margin:0 0 14px"><h2>Projeção do mês</h2>'+
        '<span class="faint" style="font-size:11.5px">dia '+dia+' de '+dim+'</span></div>'+
      '<div class="grid g3">'+
        '<div class="metric" style="padding:12px"><div class="k">Já gasto</div><div class="v down" style="font-size:16px">'+fmt(pago)+'</div></div>'+
        '<div class="metric" style="padding:12px"><div class="k">A pagar</div><div class="v warn" style="font-size:16px">'+fmt(aberto)+'</div></div>'+
        '<div class="metric" style="padding:12px"><div class="k">Projeção</div><div class="v vio" style="font-size:16px">'+fmt(total)+'</div></div></div>'+
      '<div class="help">Ritmo de <b>'+fmt(dia?pago/dia:0)+'/dia</b>. '+
        (renda?'Com renda de '+fmt(renda)+', a sobra estimada é <b class="'+(sobra>=0?"up":"down")+'">'+fmt(sobra)+'</b>.':'')+'</div>'+
      '</div></div>';
  }

  /* calendário heatmap */
  const [yy,mm]=viewMonth.split("-").map(Number);
  const dim2=new Date(yy,mm,0).getDate(), first=new Date(yy,mm-1,1).getDay();
  const byDay={}; mAll.filter(t=>t.type==="exp"&&t.dest!=="savings").forEach(t=>{
    const dd=+(t.paid&&t.payDate?t.payDate:t.due).slice(8,10); byDay[dd]=(byDay[dd]||0)+val(t); });
  const mxD=Math.max(1,...Object.values(byDay));
  let cells=""; for(let i=0;i<first;i++) cells+='<div></div>';
  for(let d=1;d<=dim2;d++){ const v=byDay[d]||0; const int=v/mxD;
    const bg=v?'rgba(255,92,122,'+(0.16+int*0.72).toFixed(2)+')':'rgba(255,255,255,.04)';
    const isT=viewMonth===mkey(todayISO())&&d===new Date().getDate();
    cells+='<div class="hcell'+(isT?" today":"")+'" style="background:'+bg+'" title="'+fmt(v)+'">'+d+'</div>'; }
  const heat='<div class="sec"><div class="surface" style="padding:20px">'+
    '<div class="sec-head" style="margin:0 0 14px"><h2>Calendário de gastos</h2>'+
      '<span class="faint" style="font-size:11.5px;text-transform:capitalize">'+shortMonth(viewMonth)+'</span></div>'+
    '<div class="heat" style="margin-bottom:8px">'+["D","S","T","Q","Q","S","S"].map(d=>'<div style="text-align:center;font-size:9.5px;color:var(--ink-4);font-weight:700">'+d+'</div>').join("")+'</div>'+
    '<div class="heat">'+cells+'</div>'+
    '<div class="heat-k">menos <i style="background:rgba(255,92,122,.2)"></i><i style="background:rgba(255,92,122,.5)"></i><i style="background:rgba(255,92,122,.88)"></i> mais</div>'+
    '</div></div>';

  /* médias por categoria */
  const cAgg={};
  for(let i=5;i>=0;i--){ const mk=addMonthsISO(viewMonth+"-01",-i).slice(0,7);
    txEffMonth(mk).forEach(t=>{ if(t.type==="exp"&&t.dest!=="savings") cAgg[t.cat]=(cAgg[t.cat]||0)+val(t); }); }
  const cAvg=Object.entries(cAgg).map(([c,v])=>[c,v/6]).sort((a,b)=>b[1]-a[1]);
  const mxA=cAvg.length?cAvg[0][1]:1;
  const medias='<div class="sec"><div class="surface" style="padding:20px">'+
    '<div class="sec-head" style="margin:0 0 14px"><h2>Média por categoria</h2>'+
      '<span class="faint" style="font-size:11.5px">6 meses</span></div>'+
    (cAvg.length?cAvg.slice(0,12).map(([c,v])=>'<div class="barline" data-action="cat-detail" data-cat="'+esc(c)+'">'+
      '<div class="bh"><div class="n">'+catIcon(c)+'<span>'+esc(c)+'</span></div><div class="v">'+fmt(v)+'/mês</div></div>'+
      '<div class="track"><i style="width:'+(v/mxA*100)+'%"></i></div></div>').join("")
      :'<div class="empty">Sem dados suficientes.</div>')+
    '</div></div>';

  /* categorias do mês */
  const expBy={},incBy={};
  m.forEach(t=>{ if(t.dest==="savings")return; const b=t.type==="exp"?expBy:incBy; b[t.cat]=(b[t.cat]||0)+val(t); });
  const expE=Object.entries(expBy).sort((a,b)=>b[1]-a[1]), incE=Object.entries(incBy).sort((a,b)=>b[1]-a[1]);
  const expT=expE.reduce((a,[,v])=>a+v,0), incT=incE.reduce((a,[,v])=>a+v,0);

  const allSel=m.length&&m.every(t=>selTx.has(t.id));
  return mpick()+
    '<div class="sec"><div class="grid g3 stagger">'+
      '<div class="metric tap" data-action="flt-status" data-v="pago"><div class="k">Pago</div>'+
        '<div class="v up" style="font-size:16px">'+fmt(sum(paid,t=>t.payAmt??t.amount))+'</div><div class="s">'+paid.length+'</div></div>'+
      '<div class="metric tap" data-action="flt-status" data-v="aberto"><div class="k">A vencer</div>'+
        '<div class="v warn" style="font-size:16px">'+fmt(sum(open))+'</div><div class="s">'+open.length+'</div></div>'+
      '<div class="metric tap" data-action="flt-status" data-v="atrasado"><div class="k">Atraso</div>'+
        '<div class="v down" style="font-size:16px">'+fmt(sum(late))+'</div><div class="s">'+late.length+'</div></div>'+
    '</div></div>'+
    proj+trend+cmp+heat+medias+
    '<div class="sec"><div class="surface" style="padding:20px">'+
      '<div class="sec-head" style="margin:0 0 14px"><h2>Gastos por categoria</h2><span class="faint" style="font-size:11.5px">'+fmt(expT)+'</span></div>'+
      bars(expE,expT)+'</div></div>'+
    '<div class="sec"><div class="surface" style="padding:20px">'+
      '<div class="sec-head" style="margin:0 0 14px"><h2>Receitas por categoria</h2><span class="faint" style="font-size:11.5px">'+fmt(incT)+'</span></div>'+
      bars(incE,incT,"green")+'</div></div>'+
    '<div class="sec"><div class="sec-head"><h2>Lançamentos</h2>'+
      '<span class="faint" style="font-size:11.5px">'+m.length+' de '+mAll.length+'</span></div>'+
      filterBar(mAll)+
      '<div class="surface" style="padding:6px 0">'+
        (m.length?'<div style="padding:10px 20px 4px;display:flex;gap:8px">'+
          '<button class="btn xs ghost" data-action="sel-all">'+(allSel?ic("x")+" Desmarcar todos":ic("checkSquare")+" Selecionar todos")+'</button>'+

        rowsList(m.slice().sort((a,b)=>a.due<b.due?-1:1))+'</div></div>'+
    '<div class="sec"><div class="act-row">'+
      '<button class="btn ghost" data-action="rep-pdf">'+ic("receipt")+' Relatório em PDF</button>'+
      '<button class="btn ghost" data-action="csv-export">'+ic("download")+' Planilha (CSV)</button></div></div>';
}

function updateSelBar(){
  // excluir um item selecionado tem que tirá-lo da soma também
  selTx.forEach(id=>{ if(!aTx().some(t=>t.id===id)) selTx.delete(id); });
  let bar=document.getElementById("selbar");
  if(!selTx.size){ if(bar) bar.remove(); return; }
  const sel=aTx().filter(t=>selTx.has(t.id));
  const inc=sel.filter(t=>t.type==="inc"), exp=sel.filter(t=>t.type!=="inc");
  const incT=sum(inc,val), expT=sum(exp,val);
  const unpaid=sel.filter(t=>!t.paid);
  const parts=[];
  if(inc.length) parts.push('<span class="up">+'+fmt(incT)+'</span>');
  if(exp.length) parts.push('<span class="down">−'+fmt(expT)+'</span>');
  const lbl=unpaid.length&&unpaid.every(t=>t.type==="inc")?"Receber":"Pagar";
  const html='<div class="si"><div class="n">'+sel.length+' selecionado'+(sel.length>1?"s":"")+'</div>'+

function syncAddForm(){
  document.querySelectorAll('#segType button').forEach(b=>b.classList.toggle("on",b.dataset.v===addType));
  document.querySelectorAll('#segKind button').forEach(b=>b.classList.toggle("on",b.dataset.v===addKind));
  const isSav=addType==="savings";
  addDest=isSav?"savings":"normal";
  $("#wrapCat").classList.toggle("hidden",isSav);
  $("#wrapGoal").classList.toggle("hidden",!isSav);
  /* competência vale para gasto e receita (não para poupança). Sempre opcional:
     vazio = comportamento de antes, o lançamento pesa no mês do vencimento. */
  if($("#wrapComp")){
    $("#wrapComp").classList.toggle("hidden",isSav);
    const hc=$("#helpComp");
    if(hc) hc.textContent=addType==="inc"
      ? "A que mês essa renda pertence. Ex.: adiantamento recebido em julho que é do salário de agosto → escolha agosto. Vazio = mês do recebimento."
      : "A que mês esse gasto pertence. Ex.: compra feita em julho que é do orçamento de agosto → escolha agosto. Vazio = mês do vencimento.";
  }
  if(isSav&&!S.goals.length){ toast("Crie uma poupança primeiro"); addType="exp"; syncAddForm(); return; }
  if(!isSav) $("#txCat").innerHTML=catOptions(addType,$("#txCat").value&&$("#txCat").value!=="__new"?$("#txCat").value:undefined);
  $("#lblValor").textContent=addKind==="parcelado"?"Valor total":"Valor";
  $("#lblAlready").textContent=isSav?"Já guardei":(addType==="inc"?"Já foi recebido":"Já foi pago");
  $("#lblDue").textContent=addKind==="parcelado"?"Venc. da 1ª parcela":(addKind==="fixo"?"1º vencimento":(isSav?"Data prevista":(addType==="inc"?"Data prevista de recebimento":"Vencimento")));
  $("#wrapParc").classList.toggle("hidden",addKind!=="parcelado");
  $("#wrapFixo").classList.toggle("hidden",addKind!=="fixo");
  // "sempre" dispensa a quantidade de meses
  if($("#wrapMonths")&&$("#txPerp")) $("#wrapMonths").classList.toggle("hidden",$("#txPerp").checked);
  $("#wrapPaid").classList.toggle("hidden",addKind!=="avista");
  // método/carteira só p/ gasto
  const showMethod=addType==="exp";
  $("#wrapMethod").classList.toggle("hidden",!showMethod);
  /* "Data da compra" fora do if: antes ele só era escondido dentro do ramo de
     gasto, então ao trocar para Receita o campo ficava preso visível. */
  $("#wrapBuy").classList.toggle("hidden",!(showMethod&&$("#txMethod").value==="cartao"));
  /* cartão e vale não debitam conta na hora da compra: o cartão debita quando
     a fatura é paga, e o vale tem saldo próprio. Pedir a conta aqui daria a
     entender que o dinheiro já saiu. */
  if($("#wrapAcc")){
    const forma=showMethod?$("#txMethod").value:"";
    const semConta=forma==="cartao"||forma==="ticket";
    $("#wrapAcc").classList.toggle("hidden",!S.accounts.length||semConta);
  }
  if(showMethod){ const mv=$("#txMethod").value;
    const isCard=mv==="cartao", isTicket=mv==="ticket";
    $("#wrapWallet").classList.toggle("hidden",!(isCard||isTicket));
    $("#lblWallet").textContent=isTicket?"Ticket":"Cartão";
    $("#wrapWallet").querySelector("select")&&($("#wrapWallet").innerHTML='<label id="lblWallet">'+(isTicket?"Ticket":"Cartão")+'</label>'+
      (isTicket?'<select id="txWallet">'+S.tickets.map(t=>'<option value="ticket:'+t.id+'">'+esc(t.name)+'</option>').join("")+'</select>'
               :'<select id="txWallet">'+S.cards.map(c=>'<option value="card:'+c.id+'">'+esc(c.nick)+' ('+esc(c.bank)+')</option>').join("")+'</select>'));
    if(isCard&&!S.cards.length){ toast("Cadastre um cartão"); $("#txMethod").value="pix"; syncAddForm(); }
    if(isTicket&&!S.tickets.length){ toast("Cadastre um ticket"); $("#txMethod").value="pix"; syncAddForm(); }
  }
}

function submitTx(){
  const val=parseMoney($("#txVal").value);
  if(!val){ toast("Informe um valor válido"); return; }
  let method="pix",cardId=null,ticketId=null,goalId=null;
  if(addType==="savings"){ goalId=$("#txGoal").value; method="transferencia"; }
  else if(addType==="exp"){ method=$("#txMethod").value;
    if(method==="cartao"){ const wv=$("#txWallet").value; cardId=wv.slice(5); }
    else if(method==="ticket"){ const wv=$("#txWallet").value; ticketId=wv.slice(7); }
  } else method="transferencia";
  const cat=addType==="savings"?"Poupança":($("#txCat").value==="__new"?"Outros":$("#txCat").value);
  createTx({ type:addType==="inc"?"inc":"exp", dest:addType==="savings"?"savings":null,
    desc:$("#txDesc").value.trim()||"Sem descrição", cat, method, cardId, ticketId, goalId,
    comp:(addType!=="savings"&&$("#txComp")&&$("#txComp").value)?$("#txComp").value:null,
    /* compra no cartão ou no vale nasce sem conta: ela só ganha uma quando a
       fatura for paga, e aí é a conta de débito do cartão */
    accId:(method==="cartao"||method==="ticket")?null:(($("#txAcc")&&$("#txAcc").value)||null),
    pesId:($("#txPes")&&$("#txPes").value)||null,
    kind:addKind, total:val, n:Math.max(2,parseInt($("#txN").value)||2),
    perp:addKind==="fixo"&&$("#txPerp")&&$("#txPerp").checked,
    paidCount:Math.max(0,parseInt($("#txPaidN").value)||0), months:Math.max(2,parseInt($("#txMonths").value)||12),
    firstDue:$("#txDue").value||todayISO(), alreadyPaid:addKind==="avista"&&$("#txAlready").checked });
  // se marcou já pago e é poupança, registra movimento
  if(addKind==="avista"&&$("#txAlready").checked&&addType==="savings"){
    const last=S.tx[S.tx.length-1]; applyPaid(last,last.due,last.amount);
  }
  save(); closeModal(); render(); toast("Lançamento salvo ✓");
}

/* ----- EXCLUSÃO -----
   Nada é removido de verdade: marca-se deleted e o lançamento vai para a
   Lixeira, de onde pode voltar. Por isso não há confirmação assustadora. */
function markDeleted(list){
  const agora=new Date().toISOString();
  list.forEach(t=>{
    if(t.deleted) return;
    // pagamento de poupança precisa sair do saldo da meta enquanto excluído
    if(t.dest==="savings"&&t.goalId){ const g=goalOf(t.goalId);
      if(g&&g.moves) g.moves=g.moves.filter(mv=>mv.txId!==t.id); }
    t.deleted=true; t.deletedAt=agora;
  });
  return list.length;
}
function restoreTx(list){
  list.forEach(t=>{
    if(!t.deleted) return;
    delete t.deleted; delete t.deletedAt;
    // se voltou já baixado e era poupança, o aporte volta junto
    if(t.paid&&t.dest==="savings"&&t.goalId) applyPaid(t,t.payDate||t.due,t.payAmt??t.amount);
  });
  return list.length;
}

function repRows(){
  let list=aTx();
  if(rep.scope==="month") list=list.filter(t=>effMonth(t)===viewMonth);
  else if(rep.scope==="range"){
    if(rep.from) list=list.filter(t=>t.due>=rep.from);
    if(rep.to) list=list.filter(t=>t.due<=rep.to);
  }
  if(rep.status==="open") list=list.filter(t=>!t.paid);
  else if(rep.status==="paid") list=list.filter(t=>t.paid);
  else if(rep.status==="late") list=list.filter(t=>!t.paid&&statusOf(t)==="atrasado");
  if(rep.type==="inc") list=list.filter(t=>t.type==="inc");
  else if(rep.type==="exp") list=list.filter(t=>t.type==="exp");
  if(rep.q){ const q=rep.q.toLowerCase().trim();
    list=list.filter(t=>(t.desc+" "+(t.cat||"")+" "+(METHODS[t.method]||"")+" "+
      (t.cardId&&cardOf(t.cardId)?cardOf(t.cardId).nick:"")).toLowerCase().includes(q)); }
  return list.sort((a,b)=>a.due<b.due?-1:1);
}
function repGroupKey(t){
  if(rep.group==="month") return monthLabel(effMonth(t));
  if(rep.group==="cat") return t.cat||"Sem categoria";
  if(rep.group==="wallet"){ if(t.cardId){const c=cardOf(t.cardId);return c?c.nick:"Cartão";}
    if(t.ticketId){const k=ticketOf(t.ticketId);return k?k.name:"Ticket";} return METHODS[t.method]||t.method; }
  if(rep.group==="status") return t.paid?(t.type==="inc"?"Recebidos":"Pagos")
    :(statusOf(t)==="atrasado"?"Em atraso":(t.type==="inc"?"A receber":"A pagar"));
  return "";
}
function repPeriodo(){
  if(rep.scope==="month") return monthLabel(viewMonth);
  if(rep.scope==="range"){
    if(rep.from&&rep.to) return fmtDate(rep.from)+" a "+fmtDate(rep.to);
    if(rep.from) return "a partir de "+fmtDate(rep.from);
    if(rep.to) return "até "+fmtDate(rep.to);
  }
  return "Todos os meses";
}
function buildReport(){
  const list=repRows();
  const inc=list.filter(t=>t.type==="inc"), exp=list.filter(t=>t.type!=="inc");
  const incPago=sum(inc.filter(t=>t.paid),val), incAb=sum(inc.filter(t=>!t.paid),val);
  const expPago=sum(exp.filter(t=>t.paid),val), expAb=sum(exp.filter(t=>!t.paid),val);
  const d=rep.detail;
  const th='<tr><th>Venc.</th><th>Descrição</th>'+(d?'<th>Categoria</th><th>Forma</th><th>Comp.</th>':"")+
    '<th>Situação</th><th class="r">Valor</th></tr>';
  const tr=t=>'<tr><td class="nw">'+fmtDate(t.due)+'</td><td>'+esc(t.desc)+
    (t.kind!=="avista"?' <span class="tag">'+(t.kind==="fixo"?(t.perp?"fixo":"fixo "+t.i+"/"+t.n):t.i+"/"+t.n)+'</span>':"")+'</td>'+
    (d?'<td>'+esc(t.cat||"—")+'</td><td>'+esc(t.cardId&&cardOf(t.cardId)?cardOf(t.cardId).nick
      :(t.ticketId&&ticketOf(t.ticketId)?ticketOf(t.ticketId).name:(METHODS[t.method]||"—")))+'</td>'+
      '<td class="nw">'+(t.comp?shortMonth(t.comp):"—")+'</td>':"")+
    '<td class="nw">'+(t.paid?(t.type==="inc"?"Recebido":"Pago")+" "+(t.payDate?fmtDate(t.payDate):"")
      :(statusOf(t)==="atrasado"?"Em atraso":"Em aberto"))+'</td>'+
    '<td class="r '+(t.type==="inc"?"pos":"neg")+'">'+(t.type==="inc"?"+":"−")+fmt(val(t))+'</td></tr>';

  let corpo="";
  if(rep.group==="none"){
    corpo='<table>'+th+list.map(tr).join("")+'</table>';
  } else {
    const grupos={};
    list.forEach(t=>{ const k=repGroupKey(t); (grupos[k]=grupos[k]||[]).push(t); });
    corpo=Object.keys(grupos).sort().map(k=>{
      const g=grupos[k], gi=sum(g.filter(t=>t.type==="inc"),val), ge=sum(g.filter(t=>t.type!=="inc"),val);
      return '<h3 class="gh">'+esc(k)+' <span>'+g.length+' lançamento'+(g.length>1?"s":"")+'</span></h3>'+
        '<table>'+th+g.map(tr).join("")+
        '<tr class="sub"><td colspan="'+(d?6:3)+'">Subtotal</td><td class="r">'+
          (gi?'<span class="pos">+'+fmt(gi)+'</span> ':"")+(ge?'<span class="neg">−'+fmt(ge)+'</span>':(gi?"":fmt(0)))+
        '</td></tr></table>';
    }).join("");
  }

  const filtrosTxt=[
    rep.q?'busca: "'+esc(rep.q)+'"':"",
    rep.status==="open"?"somente em aberto":rep.status==="paid"?"somente baixados":rep.status==="late"?"somente em atraso":"",
    rep.type==="inc"?"somente receitas":rep.type==="exp"?"somente gastos":"",
    rep.group!=="none"?"agrupado por "+({month:"mês",cat:"categoria",wallet:"cartão/forma",status:"situação"})[rep.group]:""
  ].filter(Boolean).join(" · ");

  return '<div class="rep">'+
    '<header><div><h1>'+esc(S.appName||"WIGO")+'</h1><div class="sub">Relatório de lançamentos</div></div>'+
      /* sem o e-mail da conta: o relatório costuma ser enviado a terceiros */
      '<div class="meta"><div><b>Período:</b> '+repPeriodo()+'</div>'+
        '<div><b>Emitido em:</b> '+fmtDate(todayISO())+'</div></div></header>'+
    (filtrosTxt?'<div class="filtros"><b>Filtros:</b> '+filtrosTxt+'</div>':"")+
    (list.length?
      '<div class="cards">'+
        '<div><span>Recebido</span><b class="pos">'+fmt(incPago)+'</b></div>'+
        '<div><span>A receber</span><b class="pos">'+fmt(incAb)+'</b></div>'+
        '<div><span>Pago</span><b class="neg">'+fmt(expPago)+'</b></div>'+
        '<div><span>A pagar</span><b class="neg">'+fmt(expAb)+'</b></div>'+
      '</div>'+corpo+
      '<table class="tot"><tr><td>Total de receitas</td><td class="r pos">+'+fmt(incPago+incAb)+'</td></tr>'+
        '<tr><td>Total de gastos</td><td class="r neg">−'+fmt(expPago+expAb)+'</td></tr>'+
        '<tr class="big"><td>Saldo</td><td class="r">'+fmt(incPago+incAb-expPago-expAb)+'</td></tr></table>'
      :'<p class="vazio">Nenhum lançamento encontrado com esses filtros.</p>')+
    '<footer>'+list.length+' lançamento'+(list.length===1?"":"s")+' · gerado por '+esc(S.appName||"WIGO")+'</footer>'+
  '</div>';
}

/* Imprime num iframe isolado em vez de esconder a tela do app.
   A tentativa anterior escondia o app com uma classe no body e a removia por
   temporizador — só que o diálogo de impressão fica aberto o tempo que o
   usuário quiser, então a página voltava ao normal antes de ele salvar e o
   PDF saía com a tela inteira. Dentro do iframe isso não acontece: ele
   contém apenas o relatório, do começo ao fim. */
function printReport(){
  const antigo=document.getElementById("printFrame");
  if(antigo) antigo.remove();
  const f=document.createElement("iframe");
  f.id="printFrame";
  f.setAttribute("aria-hidden","true");
  f.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none";
  document.body.appendChild(f);
  const d=f.contentWindow.document;
  d.open();
  d.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'+
    '<title>'+esc(S.appName||"WIGO")+' — relatório</title>'+
    '<style>'+REPORT_CSS+'</style></head><body>'+buildReport()+'</body></html>');
  d.close();
  const disparar=()=>{
    try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ toast("Não foi possível abrir a impressão"); }
    // só remove quando o diálogo fecha e o foco volta para o app
    const limpar=()=>{ window.removeEventListener("focus",limpar); setTimeout(()=>f.remove(),400); };
    window.addEventListener("focus",limpar);
  };
  // dá um instante para as fontes e o layout assentarem antes de medir a página
  if(d.readyState==="complete") setTimeout(disparar,120);
  else f.onload=()=>setTimeout(disparar,120);
}

function vincList(pesId){
  const q=vincQ.trim().toLowerCase();
  let lista=aTx().filter(t=>t.type!=="xfer");
  if(q){
    const num=q.replace(/[^\d,]/g,"").replace(",",".");
    lista=lista.filter(t=>{
      if((t.desc+" "+(t.cat||"")).toLowerCase().includes(q)) return true;
      return num&&String(val(t)).includes(num);
    });
  } else {
    /* sem busca, mostra os já vinculados primeiro e depois os mais recentes,
       para não despejar anos de histórico de uma vez */
    lista=lista.slice().sort((a,b)=>{
      const av=a.pesId===pesId?0:1, bv=b.pesId===pesId?0:1;
      if(av!==bv) return av-bv;
      return a.due<b.due?1:-1;
    }).slice(0,60);
  }
  if(!lista.length) return '<div class="empty">Nada encontrado.</div>';
  return '<div class="del-list" style="max-height:340px">'+lista.map(t=>{
    const outra=t.pesId&&t.pesId!==pesId?pesOf(t.pesId):null;
    return '<label class="check-line pick"><input type="checkbox" name="vinc" value="'+t.id+'"'+
      (t.pesId===pesId?" checked":"")+'>'+
      '<span><b>'+esc(t.desc)+'</b><br><span class="faint" style="font-size:11.5px">'+
        fmtDate(t.due)+" · "+(t.type==="inc"?"+":"−")+fmt(val(t))+" · "+stLabel(t)+
        (outra?' · <span style="color:var(--warn)">hoje é de '+esc(outra.name)+'</span>':"")+
      '</span></span></label>';
  }).join("")+'</div>';
}

/* ══════════════════ IMPORTAR EXTRATO ══════════════════
   Lê um extrato do banco (CSV ou OFX) e transforma cada movimentação em um
   PRÉ-LANÇAMENTO revisável. Nada entra em S.tx antes de o usuário confirmar —
   é essa a diferença entre importar e deixar o banco escrever no seu financeiro.

   Quatro camadas, nesta ordem: LEITURA (arquivo → texto), PARSING (texto →
   movimentações), INTELIGÊNCIA (tipo, método, categoria, duplicidade) e UI.
   Nenhuma delas conhece a de cima: o parser não monta HTML e a tela não lê
   arquivo. É o que permite mexer no OFX sem quebrar a revisão.

   O extrato é dinheiro que JÁ se moveu. Todo lançamento nasce paid:true, com
   due e payDate na data do extrato e kind "avista". A importação nunca cria
   previsão, nunca infere transferência (type "xfer"), nunca atribui cartão e
   nunca infere poupança — as três dependem de intenção, que o arquivo não tem.

   O estado da importação vive FORA de S, como filters, rep e selCards: é tela,
   não dado, e não tem por que viajar para o Firestore a cada save(). */

let imp=null;
const IMP_MAX_BYTES=10*1024*1024;   // 10 MB: acima disso o navegador engasga
const IMP_MAX_MOVS=2000;            // teto de movimentações processadas
const IMP_MAX_LISTA=300;            // teto de itens desenhados de uma vez

/* ---------- camada 1: LEITURA ---------- */

function detectarFormatoArquivo(nome,texto){
  const ext=(nome||"").toLowerCase().split(".").pop();
  if(ext==="ofx"||ext==="qfx") return "ofx";
  if(/OFXHEADER|<OFX>|<STMTTRN/i.test(texto||"")) return "ofx";
  if(ext==="csv"||ext==="txt") return "csv";
  return null;
}
/* Extrato brasileiro sai em UTF-8 ou Windows-1252 e o arquivo não diz qual é.
   TextDecoder com fatal:true recusa a sequência inválida — é isso que separa os
   dois casos sem depender de procurar acento quebrado no meio do texto. */
function detectarEncodingCSV(buf){
  try{ return {texto:new TextDecoder("utf-8",{fatal:true}).decode(buf),encoding:"UTF-8"}; }
  catch{ return {texto:new TextDecoder("windows-1252").decode(buf),encoding:"Windows-1252"}; }
}
function lerArquivoImportacao(file){
  return new Promise((ok,falha)=>{
    const r=new FileReader();
    r.onerror=()=>falha(new Error("leitura"));
    r.onload=()=>{ try{ ok(detectarEncodingCSV(r.result)); }catch(e){ falha(e); } };
    r.readAsArrayBuffer(file);
  });
}

/* ---------- camada 2: PARSING ---------- */

function normalizarTextoImportacao(s){
  return String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}
/* 1.234,56 · 1234,56 · 1234.56 · -1.234,56 · R$ 1.234,56 · (150,00) · 150,00 D
   O separador decimal é o ÚLTIMO que aparece. Com três dígitos depois dele e
   nenhum outro separador no número, é milhar — 1.234 é mil duzentos e trinta e
   quatro, que é como o extrato brasileiro escreve. */
function normalizarValorImportacao(v){
  if(typeof v==="number") return isFinite(v)?Math.round(v*100)/100:NaN;
  let s=String(v??"").trim();
  if(!s) return NaN;
  let sinal=1;
  if(/^\(.*\)$/.test(s)){ sinal=-1; s=s.slice(1,-1); }
  s=s.replace(/R\$/ig,"").replace(/[\s\u00a0]/g,"");
  const suf=s.match(/([DC])$/i);
  if(suf&&/[\d)]/.test(s.charAt(s.length-2))){
    if(suf[1].toUpperCase()==="D") sinal=-1;
    s=s.slice(0,-1);
  }
  if(s.indexOf("-")>=0){ sinal=-1; s=s.replace(/-/g,""); }
  s=s.replace(/\+/g,"");
  if(!/^[\d.,]+$/.test(s)||!/\d/.test(s)) return NaN;
  const ult=Math.max(s.lastIndexOf(","),s.lastIndexOf("."));
  if(ult>=0){
    const casas=s.length-ult-1, seps=(s.match(/[.,]/g)||[]).length;
    if(casas===3&&seps===1) s=s.replace(/[.,]/g,"");
    else s=s.slice(0,ult).replace(/[.,]/g,"")+"."+s.slice(ult+1);
  }
  const n=parseFloat(s);
  return isNaN(n)?NaN:sinal*Math.round(n*100)/100;
}
/* 20260908120000[-03:BRT] · 08/09/2026 · 2026-09-08 · 08/09/26 · 20260908
   Horário e fuso são descartados: lançamento financeiro tem dia, não hora.
   Data com barra é lida como dd/mm — é extrato brasileiro. */
function normalizarDataImportacao(v){
  const s=String(v??"").trim();
  if(!s) return null;
  let y,m,d,mm;
  if((mm=s.match(/^(\d{4})(\d{2})(\d{2})/))){ y=+mm[1]; m=+mm[2]; d=+mm[3]; }
  else if((mm=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))){ y=+mm[1]; m=+mm[2]; d=+mm[3]; }
  else if((mm=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){
    d=+mm[1]; m=+mm[2]; y=+mm[3];
    if(y<100) y+=y<70?2000:1900;
    if(d>12&&m>12) return null;
    if(d<=12&&m>12){ const t=d; d=m; m=t; }   // veio mm/dd
  }
  else return null;
  if(!(y>=1900&&y<=2200)||!(m>=1&&m<=12)||!(d>=1&&d<=31)) return null;
  const t=new Date(y,m-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==m-1||t.getDate()!==d) return null;  // 31/02
  return toISO(t);
}

/* OFX vem em duas roupas: SGML (tag sem fechamento) e XML. Ler "do <TAG> até o
   próximo <" atende as duas sem precisar de parser de verdade. */
function tagOFX(bloco,tag){
  const m=bloco.match(new RegExp("<"+tag+">([^<]*)","i"));
  return m?m[1].trim():"";
}
/* MEMO costuma trazer o histórico completo e NAME a contraparte. Juntar os dois
   só ajuda quando um não está contido no outro — senão vira repetição. */
function descOFX(name,memo,tipo){
  const n=(name||"").trim(), m=(memo||"").trim();
  if(n&&m){
    const nn=normalizarTextoImportacao(n), mn=normalizarTextoImportacao(m);
    if(nn&&mn&&!mn.includes(nn)&&!nn.includes(mn)) return n+" · "+m;
    return m.length>=n.length?m:n;
  }
  return m||n||(tipo||"").trim()||"Movimentação";
}
function parseOFX(texto){
  const t=String(texto||"");
  if(!/<STMTTRN>/i.test(t)) return {movs:[],erro:"ofx"};
  const movs=[];
  t.split(/<STMTTRN>/i).slice(1).forEach(b=>{
    if(movs.length>=IMP_MAX_MOVS) return;
    const fim=b.search(/<\/STMTTRN>/i);
    const bloco=fim>=0?b.slice(0,fim):b;
    movs.push({
      data:normalizarDataImportacao(tagOFX(bloco,"DTPOSTED")),
      amount:normalizarValorImportacao(tagOFX(bloco,"TRNAMT")),
      desc:descOFX(tagOFX(bloco,"NAME"),tagOFX(bloco,"MEMO"),tagOFX(bloco,"TRNTYPE")),
      fitid:tagOFX(bloco,"FITID")||null
    });
  });
  return {movs,erro:movs.length?null:"vazio"};
}

/* Conta separadores fora de aspas nas primeiras linhas. Empate vai para o ";",
   que é o que sai da maioria dos bancos brasileiros. */
function detectarSeparadorCSV(texto){
  const linhas=String(texto||"").split(/\r?\n/).filter(l=>l.trim()).slice(0,8);
  if(!linhas.length) return ";";
  let melhor=";", pontos=0;
  [";","\t",","].forEach(sep=>{
    const cont=linhas.map(l=>{ let n=0,asp=false;
      for(const c of l){ if(c==='"') asp=!asp; else if(c===sep&&!asp) n++; }
      return n; });
    const min=Math.min(...cont);
    const p=min>0?min*10+(cont.every(x=>x===cont[0])?5:0):0;
    if(p>pontos){ pontos=p; melhor=sep; }
  });
  return melhor;
}
/* Tokenizer próprio: aspas duplas, "" escapado e quebra de linha dentro do
   campo. split(";") quebraria em qualquer histórico com ponto e vírgula. */
function parseCSV(texto,sep){
  const t=String(texto||"").replace(/^\uFEFF/,"");
  const out=[]; let linha=[], campo="", asp=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(asp){
      if(c==='"'){ if(t[i+1]==='"'){ campo+='"'; i++; } else asp=false; }
      else campo+=c;
    }
    else if(c==='"') asp=true;
    else if(c===sep){ linha.push(campo); campo=""; }
    else if(c==="\n"){ linha.push(campo); out.push(linha); linha=[]; campo=""; }
    else if(c!=="\r") campo+=c;
  }
  if(campo!==""||linha.length){ linha.push(campo); out.push(linha); }
  return out.filter(l=>l.some(c=>String(c).trim()));
}

const IMP_COLS={
  data:["data","dt","date","data lancamento","data movimento","data movimentacao",
        "data da compra","data operacao","data balancete"],
  desc:["descricao","historico","lancamento","memo","nome","detalhe","estabelecimento",
        "descricao lancamento","historico lancamento","transacao"],
  valor:["valor","amount","valor movimentado","valor lancamento","montante","valor r"],
  debito:["debito","saida","retirada","valor debito","debitos"],
  credito:["credito","entrada","receita","valor credito","creditos"],
  tipo:["tipo","tipo lancamento","natureza","tipo movimento","d c","dc"]
};
/* Casa o cabeçalho por igualdade, depois por prefixo, depois por conteúdo —
   nessa ordem, para "valor" não roubar a coluna "valor debito". */
function detectarColunasCSV(cab){
  const norm=(cab||[]).map(normalizarTextoImportacao);
  const acha=lista=>{
    let i=norm.findIndex(n=>n&&lista.includes(n));
    if(i<0) i=norm.findIndex(n=>n&&lista.some(l=>n.startsWith(l)));
    if(i<0) i=norm.findIndex(n=>n&&lista.some(l=>n.includes(l)));
    return i<0?null:i;
  };
  const c={ data:acha(IMP_COLS.data), desc:acha(IMP_COLS.desc),
    debito:acha(IMP_COLS.debito), credito:acha(IMP_COLS.credito), tipo:acha(IMP_COLS.tipo) };
  c.valor=acha(IMP_COLS.valor);
  if(c.valor!=null&&(c.valor===c.debito||c.valor===c.credito)) c.valor=null;
  if(c.desc!=null&&c.desc===c.data) c.desc=null;
  c.confiavel=c.data!=null&&c.desc!=null&&(c.valor!=null||c.debito!=null||c.credito!=null);
  return c;
}
function mapearCSV(linhas,cols){
  const movs=[];
  linhas.forEach(l=>{
    if(movs.length>=IMP_MAX_MOVS) return;
    let amount=NaN;
    if(cols.valor!=null) amount=normalizarValorImportacao(l[cols.valor]);
    if(isNaN(amount)&&(cols.debito!=null||cols.credito!=null)){
      const d=cols.debito!=null?normalizarValorImportacao(l[cols.debito]):NaN;
      const c=cols.credito!=null?normalizarValorImportacao(l[cols.credito]):NaN;
      const dd=isNaN(d)?0:Math.abs(d), cc=isNaN(c)?0:Math.abs(c);
      if(dd||cc) amount=cc-dd;
    }
    /* coluna D/C manda no sinal: muito banco exporta o valor sempre positivo */
    if(cols.tipo!=null&&!isNaN(amount)){
      const s=normalizarTextoImportacao(l[cols.tipo]);
      if(/^(d|debito|debit|saida)$/.test(s)) amount=-Math.abs(amount);
      else if(/^(c|credito|credit|entrada)$/.test(s)) amount=Math.abs(amount);
    }
    movs.push({ data:normalizarDataImportacao(l[cols.data]), amount,
      desc:String(l[cols.desc]??"").trim()||"Movimentação", fitid:null });
  });
  return movs;
}

/* ---------- camada 3: INTELIGÊNCIA ---------- */

/* FNV-1a de 32 bits: determinística, curta e sem dependência. É a identidade do
   CSV, que quase nunca traz um id próprio como o FITID do OFX. */
function gerarHashImportacao(s){
  let h=0x811c9dc5;
  const t=String(s||"");
  for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193); }
  return (h>>>0).toString(16).padStart(8,"0");
}
/* Duas descrições são a mesma quando uma contém a outra ou quando compartilham
   a maior parte das palavras longas: "PIX ENVIADO MERCADO X" e "PIX MERCADO X"
   são o mesmo lançamento visto por dois canais. */
function compararDescricoesImportacao(a,b){
  const x=normalizarTextoImportacao(a), y=normalizarTextoImportacao(b);
  if(!x||!y) return false;
  if(x===y||x.includes(y)||y.includes(x)) return true;
  const tx=x.split(" ").filter(p=>p.length>=4), ty=y.split(" ").filter(p=>p.length>=4);
  if(!tx.length||!ty.length) return false;
  const comuns=tx.filter(p=>ty.includes(p)).length;
  return comuns/Math.min(tx.length,ty.length)>=0.6;
}
/* Duas camadas de proteção, e nenhuma sozinha basta: a marca de origem (FITID
   no OFX, assinatura no CSV) não existe no que foi digitado à mão, e a
   comparação por valor+data+descrição não sobrevive a uma edição posterior.

   Data com folga de um dia porque o banco lança no dia seguinte com frequência.
   Valor igual sozinho NÃO é duplicata: dois cafés de R$ 15 no mesmo dia são
   duas compras, e a descrição é o que separa. */
function ehDuplicadoImportacao(mov,accId,marcas){
  const chave=mov.fitid||gerarHashImportacao(
    accId+"|"+mov.data+"|"+Math.abs(mov.amount).toFixed(2)+"|"+normalizarTextoImportacao(mov.desc));
  if(marcas&&marcas.has(chave))
    return {dup:true,chave,igual:aTx().find(t=>t.impId===chave)||null,motivo:"marca"};
  const alvo=Math.abs(mov.amount), quando=daysTo(mov.data);
  let igual=null, confira=null;
  aTx().some(t=>{
    if(t.accId!==accId&&t.accTo!==accId) return false;
    if(Math.abs(Math.abs(val(t))-alvo)>0.005) return false;
    const dt=t.paid?(t.payDate||t.due):t.due;
    const dif=Math.abs(daysTo(dt)-quando);
    if(dif>1) return false;
    if(compararDescricoesImportacao(t.desc,mov.desc)){ igual=t; return true; }
    /* mesmo valor e mesmo dia, com outro nome: pode ser o mesmo lançamento
       digitado à mão, e pode ser coincidência. Guarda para avisar, sem afirmar. */
    if(dif===0&&!confira) confira=t;
    return false;
  });
  if(igual) return {dup:true,chave,igual,motivo:"conteudo"};
  if(confira) return {dup:false,chave,igual:confira,motivo:"confira"};
  return {dup:false,chave,igual:null,motivo:null};
}

function sugerirTipoImportacao(mov){ return mov.amount<0?"exp":"inc"; }

/* nunca "cartao" nem "ticket": o extrato é da conta, e a fatura do cartão é
   outro lugar do app — atribuir aqui faria o valor sair duas vezes */
const IMP_METODO=[
  [/\bpix\b/,"pix"],
  [/\b(ted|doc)\b|transferenc/,"transferencia"],
  [/boleto|titulo de cobranca|cobranca bancaria/,"boleto"],
  [/saque|em especie|dinheiro/,"dinheiro"]
];
function sugerirMetodoImportacao(desc){
  const d=normalizarTextoImportacao(desc);
  for(const [re,m] of IMP_METODO) if(re.test(d)) return m;
  return "debito";
}
/* Palavras → categoria. A sugestão só vale se a categoria existir na lista do
   usuário: a importação nunca cria categoria. Sem correspondência fica vazia —
   em branco é honesto, chutar não. Chaves curtas ficaram de fora de propósito
   ("gol", "oi", "max"): o falso positivo custa mais caro que o campo vazio. */
const IMP_CATS=[
  [["ifood","uber eats","rappi","restaurante","lanchonete","padaria","pizzaria","hamburgueria","cafeteria"],["Restaurantes/Delivery","Alimentação"]],
  [["mercado","supermercado","atacadao","hortifruti","acougue","carrefour","assai","pao de acucar"],["Mercado","Alimentação"]],
  [["posto","combustivel","gasolina","shell","ipiranga","petrobras"],["Combustível","Transporte"]],
  [["uber","99app","taxi","onibus","metro","bilhete unico","estacionamento","pedagio"],["Transporte"]],
  [["farmacia","drogaria","droga raia","drogasil","panvel"],["Farmácia","Saúde"]],
  [["hospital","clinica","laboratorio","dentista","unimed","amil","plano de saude"],["Saúde"]],
  [["netflix","spotify","prime video","disney","hbo","youtube premium","deezer","globoplay"],["Assinaturas"]],
  [["vivo","claro","telefonica","internet","banda larga","telefone"],["Internet/Telefone"]],
  [["energia","cemig","enel","copel","light","sabesp","saneamento","conta de agua"],["Contas de Casa"]],
  [["aluguel","condominio","imobiliaria"],["Aluguel","Moradia"]],
  [["academia","smart fit","smartfit","gympass","crossfit","pilates"],["Academia/Esportes"]],
  [["escola","faculdade","universidade","mensalidade","udemy","alura"],["Educação","Cursos"]],
  [["petshop","pet shop","veterinar","petz","cobasi"],["Pets"]],
  [["cinema","teatro","ingresso","steam","playstation","xbox","nintendo"],["Lazer"]],
  [["hotel","pousada","airbnb","passagem aerea","latam","decolar"],["Viagens"]],
  [["tarifa","iof","anuidade","manutencao de conta","cesta de servicos"],["Tarifas Bancárias"]],
  [["imposto","darf","iptu","ipva","tributo","receita federal"],["Impostos/Taxas"]],
  [["emprestimo","financiamento","consignado"],["Empréstimos/Dívidas"]],
  [["salario","folha de pagamento","proventos","remuneracao"],["Salário"]],
  [["rendimento","dividendo","juros sobre","cdb","tesouro direto","aplicacao"],["Rendimentos"]],
  [["reembolso","estorno","devolucao"],["Reembolso"]]
];
function sugerirCategoriaImportacao(desc,tipo){
  const d=" "+normalizarTextoImportacao(desc)+" ";
  const lista=tipo==="inc"?S.incCats:S.expCats;
  for(const [chaves,cands] of IMP_CATS){
    if(!chaves.some(k=>d.includes(k))) continue;
    const ok=cands.find(c=>lista.includes(c));
    if(ok) return ok;
  }
  return "";
}

/* movimentação crua → movimentação validada; erro descrito, nunca silencioso */
function normalizarMovimentacaoImportada(mov){
  if(!mov.data) return {ok:false,erro:"Data não reconhecida"};
  if(isNaN(mov.amount)) return {ok:false,erro:"Valor não reconhecido"};
  if(!mov.amount) return {ok:false,erro:"Valor zerado"};
  return {ok:true,erro:null};
}
/* movimentação validada → pré-lançamento, com as sugestões e o aviso de
   duplicidade já resolvidos. amount é sempre POSITIVO: no WIGO quem carrega o
   sinal é o type, como val() e signed() esperam. */
function criarPreLancamento(mov,accId,origem,marcas){
  const base={ id:uid(), origem, fitid:mov.fitid||null, chave:null,
    data:mov.data||"", descOriginal:mov.desc||"", desc:mov.desc||"",
    amount:0, type:"exp", method:"debito", cat:"", accId,
    duplicado:false, motivo:null, igualId:null, selecionado:false, erro:null };
  const v=normalizarMovimentacaoImportada(mov);
  if(!v.ok) return Object.assign(base,{erro:v.erro});
  const type=sugerirTipoImportacao(mov);
  const d=ehDuplicadoImportacao(mov,accId,marcas);
  return Object.assign(base,{ chave:d.chave, amount:Math.abs(mov.amount), type,
    method:sugerirMetodoImportacao(mov.desc),
    cat:sugerirCategoriaImportacao(mov.desc,type),
    duplicado:d.dup, motivo:d.motivo, igualId:d.igual?d.igual.id:null,
    selecionado:!d.dup });
}
function preLancamentosDe(movs,accId,origem){
  /* marcas já usadas: o que veio de importação anterior e, conforme a lista
     cresce, o próprio arquivo — extrato repetido dentro do mesmo CSV existe */
  const marcas=new Set(aTx().map(t=>t.impId).filter(Boolean));
  return movs.map(m=>{
    const pre=criarPreLancamento(m,accId,origem,marcas);
    if(pre.chave) marcas.add(pre.chave);
    return pre;
  });
}

/* ---------- confirmação: pré-lançamento → lançamento ---------- */

/* Reaproveita createTx, o mesmo caminho da criação manual. Assim o formato do
   lançamento — e qualquer regra futura de criação — vale também para o que veio
   do banco, sem uma segunda porta de entrada em S.tx.

   O extrato é dinheiro que já se moveu: alreadyPaid, com due e payDate na data
   do extrato e competência no mês em que ocorreu. Sem categoria vira "Outros",
   que existe nas duas listas — cat vazia deixaria um grupo sem nome no donut. */
function criarLancamentoImportado(pre){
  const gid=createTx({ type:pre.type, dest:null, desc:pre.desc, cat:pre.cat||"Outros",
    method:pre.method, cardId:null, ticketId:null, goalId:null,
    accId:pre.accId, pesId:null, comp:mkey(pre.data),
    kind:"avista", total:pre.amount, n:2, paidCount:0, months:12,
    firstDue:pre.data, alreadyPaid:true, payDate:pre.data });
  /* marca de origem: é o que impede a próxima importação do mesmo extrato de
     duplicar o que já entrou, mesmo depois de o lançamento ser editado */
  S.tx.forEach(t=>{ if(t.gid===gid) t.impId=pre.chave||null; });
  return gid;
}
function confirmarPreLancamentos(){
  if(!imp) return;
  const sel=imp.linhas.filter(l=>l.selecionado&&!l.erro);
  if(!sel.length){ toast("Selecione ao menos uma movimentação"); return; }
  const antes=S.tx.length;
  sel.forEach(criarLancamentoImportado);
  const ids=S.tx.slice(antes).map(t=>t.id);
  S.ultimaImportacao={ids,quando:Date.now()};
  /* um save() só para o lote inteiro: o debounce de 700ms existe justamente
     para 40 lançamentos não virarem 40 escritas no Firestore */
  save(); render();
  imp.resultado={ criados:ids.length,
    dup:imp.linhas.filter(l=>l.duplicado&&!l.selecionado).length,
    semcat:sel.filter(l=>!l.cat).length,
    erro:imp.linhas.filter(l=>l.erro).length };
  imp.etapa="resultado"; renderImportacao();
}
/* Desfazer manda para a Lixeira, não remove: excluir de verdade quebraria a
   regra de que nada some do histórico sem poder voltar. */
function desfazerUltimaImportacao(){
  const u=S.ultimaImportacao;
  if(!u||!u.ids||!u.ids.length){ toast("Nada para desfazer"); return; }
  const set=new Set(u.ids);
  const alvo=S.tx.filter(t=>set.has(t.id)&&!t.deleted);
  if(!alvo.length){ S.ultimaImportacao=null; save(); toast("Esses lançamentos já saíram"); return; }
  if(!confirm("Mandar para a lixeira os "+alvo.length+" lançamentos da última importação?")) return;
  markDeleted(alvo);
  S.ultimaImportacao=null;
  imp=null; save(); closeModal(); render();
  toast(alvo.length+" lançamento(s) na lixeira ✓");
}

/* ---------- camada 4: UI ---------- */

function abrirImportacao(){
  if(!S.accounts.length){ toast("Cadastre uma conta antes de importar um extrato"); return; }
  imp={ contaId:S.accounts[0].id, arquivo:null, formato:null, encoding:null,
    etapa:"arquivo", linhas:[], colunas:null, bruto:null, sep:null,
    q:"", flt:"todos", resultado:null };
  renderImportacao();
}
function fecharImportacao(){ imp=null; closeModal(); }
function descartarImportacao(){
  if(imp&&imp.linhas.length&&!confirm("Descartar as movimentações lidas? Nada foi lançado ainda.")) return;
  imp=null; closeModal(); toast("Importação descartada");
}
function impContas(sel){
  return S.accounts.map(a=>'<option value="'+a.id+'"'+(a.id===sel?" selected":"")+'>'+esc(a.name)+'</option>').join("");
}

/* orquestração: arquivo → texto → movimentações → pré-lançamentos → revisão */
async function processarArquivoImportacao(file){
  if(!imp) return;
  if(!file){ toast("Selecione um arquivo para continuar"); return; }
  if(file.size>IMP_MAX_BYTES){ toast("Arquivo muito grande — o limite é 10 MB"); return; }
  let lido;
  try{ lido=await lerArquivoImportacao(file); }
  catch{ toast("Não foi possível ler o arquivo"); return; }
  const formato=detectarFormatoArquivo(file.name,lido.texto);
  if(!formato){ toast("Formato não suportado. Selecione um arquivo CSV ou OFX."); return; }
  imp.arquivo=file.name; imp.formato=formato; imp.encoding=lido.encoding;

  if(formato==="ofx"){
    const {movs,erro}=parseOFX(lido.texto);
    if(erro==="ofx"){ toast("Não foi possível interpretar este arquivo OFX. Exporte direto pelo banco."); return; }
    if(!movs.length){ toast("Nenhuma movimentação encontrada no arquivo"); return; }
    imp.linhas=preLancamentosDe(movs,imp.contaId,"ofx");
    imp.etapa="revisao"; renderImportacao(); return;
  }
  const sep=detectarSeparadorCSV(lido.texto);
  const bruto=parseCSV(lido.texto,sep);
  if(bruto.length<2){ toast("Nenhuma movimentação encontrada no arquivo"); return; }
  imp.sep=sep; imp.bruto=bruto;
  const cols=detectarColunasCSV(bruto[0]);
  imp.colunas=cols;
  /* detecção duvidosa não importa em silêncio: pergunta em vez de errar calado */
  if(!cols.confiavel){ imp.etapa="colunas"; renderImportacao(); return; }
  aplicarColunasImportacao(cols);
}
function aplicarColunasImportacao(cols){
  const movs=mapearCSV(imp.bruto.slice(1),cols);
  if(!movs.length){ toast("Nenhuma movimentação encontrada no arquivo"); return; }
  imp.colunas=cols;
  imp.linhas=preLancamentosDe(movs,imp.contaId,"csv");
  imp.etapa="revisao"; renderImportacao();
}

function renderImportacao(){
  if(!imp) return;
  if(imp.etapa==="colunas") openModal(impTelaColunas());
  else if(imp.etapa==="revisao") openModal(impTelaRevisao());
  else if(imp.etapa==="resultado") openModal(renderResumoImportacao());
  else openModal(impTelaArquivo());
}
function impTelaArquivo(){
  const u=S.ultimaImportacao;
  return modalHead("Importar extrato","Vira pré-lançamento, não lançamento: você revisa antes")+
  '<label>Conta</label><select id="impConta">'+impContas(imp.contaId)+'</select>'+
  '<div class="help">Todas as movimentações do arquivo entram nesta conta. Dá para trocar depois, uma a uma.</div>'+
  '<label style="margin-top:16px">Arquivo</label>'+
  '<button type="button" class="btn ghost" data-action="imp-escolher">'+ic("upload")+' Selecionar extrato</button>'+
  '<input type="file" id="impArquivo" accept=".csv,.ofx,.qfx,.txt" class="hidden">'+
  '<div class="help">CSV ou OFX exportado pelo banco, até 10 MB. O arquivo é lido aqui no navegador — não sai do seu aparelho.</div>'+
  (u&&u.ids&&u.ids.length?'<div class="help" style="margin-top:16px">Última importação: <b>'+u.ids.length+
    '</b> lançamento(s). <b data-action="desfazer-importacao" style="color:var(--v-2);cursor:pointer">Desfazer</b></div>':"")+
  '<div class="act-row"><button type="button" class="btn small ghost" data-action="fechar-importacao">Cancelar</button></div>';
}
function impTelaColunas(){
  const cab=imp.bruto[0]||[], c=imp.colunas||{};

function impStats(){
  const l=imp?imp.linhas:[];
  return { total:l.length,
    erro:l.filter(x=>x.erro).length,
    dup:l.filter(x=>x.duplicado&&!x.erro).length,
    confira:l.filter(x=>x.motivo==="confira"&&!x.erro).length,
    semcat:l.filter(x=>!x.cat&&!x.erro).length,
    sel:l.filter(x=>x.selecionado&&!x.erro).length };
}
function renderResumoContagem(){
  const s=impStats();
  const it=(n,r)=>'<div><b>'+n+'</b><span>'+r+'</span></div>';
  return '<div class="imp-stats">'+it(s.total,"encontradas")+it(s.sel,"a lançar")+
    (s.dup?it(s.dup,"já no app"):"")+(s.confira?it(s.confira,"confira"):"")+
    (s.semcat?it(s.semcat,"sem categoria"):"")+(s.erro?it(s.erro,"com erro"):"")+'</div>';
}
function impChips(){
  const s=impStats(), l=imp.linhas;
  return [["todos","Todos",s.total],["sel","A lançar",s.sel],
    ["dup","Já no app",s.dup],["confira","Confira",s.confira],
    ["semcat","Sem categoria",s.semcat],
    ["exp","Despesas",l.filter(x=>x.type==="exp"&&!x.erro).length],
    ["inc","Receitas",l.filter(x=>x.type==="inc"&&!x.erro).length],
    ["erro","Com erro",s.erro]]
    .filter(([v,,n])=>n||v==="todos")
    .map(([v,r,n])=>'<button type="button" class="fchip'+(imp.flt===v?" on":"")+
      '" data-action="imp-flt" data-v="'+v+'">'+r+'<span class="n">'+n+'</span></button>').join("");
}
function impFiltradas(){
  const q=normalizarTextoImportacao(imp.q);
  return imp.linhas.filter(l=>{
    if(imp.flt==="sel"&&!l.selecionado) return false;
    if(imp.flt==="dup"&&!l.duplicado) return false;
    if(imp.flt==="confira"&&l.motivo!=="confira") return false;
    if(imp.flt==="semcat"&&(l.cat||l.erro)) return false;
    if(imp.flt==="exp"&&(l.type!=="exp"||l.erro)) return false;
    if(imp.flt==="inc"&&(l.type!=="inc"||l.erro)) return false;
    if(imp.flt==="erro"&&!l.erro) return false;
    if(q&&!normalizarTextoImportacao(l.desc+" "+l.data+" "+l.amount).includes(q)) return false;
    return true;
  });
}
/* Dizer "já está no app" sem dizer COM O QUÊ obriga o usuário a sair da tela
   para conferir. O selo nomeia o lançamento que casou, com data e valor. */
function impSeloIgual(l){
  if(!l.duplicado&&l.motivo!=="confira") return "";
  const t=l.igualId?S.tx.find(x=>x.id===l.igualId&&!x.deleted):null;
  const quem=t?esc(t.desc)+" · "+fmtDate(t.paid?(t.payDate||t.due):t.due)+" · "+fmt(val(t)):"";
  if(l.motivo==="confira")
    return '<span class="chip proximo">Confira: já existe '+quem+'</span>';
  /* o rótulo cai em "Já no app" quando o motivo não veio: melhor um selo
     genérico que nenhum, num aviso cujo papel é justamente não deixar passar */
  const rot=l.motivo==="marca"?"Já importado antes":"Já no app";
  return '<span class="chip pop">'+rot+(quem?" — "+quem:"")+'</span>';
}

/* A lista sai numa string só, e com teto: 2.000 movimentações viram 2.000 nós
   se cada uma for inserida por vez, e o celular trava antes de terminar. */
function renderListaPreLancamentos(){
  const lista=impFiltradas();
  if(!lista.length) return '<div class="empty">Nenhuma movimentação neste filtro.</div>';
  const corte=lista.slice(0,IMP_MAX_LISTA);
  const html='<div class="del-list imp-list">'+corte.map(l=>{
    const meta=[fmtDate(l.data),METHODS[l.method]||l.method,l.cat||"sem categoria"].join(" · ");
    return '<div class="imp-item'+(l.erro?" erro":"")+'">'+
      '<label class="imp-pick"><input type="checkbox" name="impSel" data-id="'+l.id+'"'+
        (l.selecionado?" checked":"")+(l.erro?" disabled":"")+'></label>'+
      '<div class="imp-mid" data-action="editar-pre-lancamento" data-id="'+l.id+'">'+
        '<b>'+esc(l.desc)+'</b><span class="faint">'+esc(meta)+'</span>'+
        impSeloIgual(l)+
        (l.erro?'<span class="chip atrasado">'+esc(l.erro)+'</span>':"")+'</div>'+
      '<div class="imp-rt"><b class="'+(l.type==="inc"?"up":"down")+'">'+
        (l.erro?"—":(l.type==="inc"?"+":"−")+fmt(l.amount))+'</b>'+
        (l.erro?"":'<span class="faint">editar</span>')+'</div></div>';
  }).join("")+'</div>';
  return html+(lista.length>corte.length?'<div class="help" style="text-align:center">Mostrando '+
    corte.length+' de '+lista.length+'. Use a busca ou os filtros para chegar no resto.</div>':"");
}
function impRodape(){
  const n=impStats().sel;
  return '<div class="act-row">'+
    '<button type="button" class="btn small ghost" data-action="descartar-importacao">Descartar</button>'+
    '<button type="button" class="btn small" data-action="confirmar-importacao"'+(n?"":" disabled")+'>'+
      (n?"Confirmar "+n+" selecionado"+(n>1?"s":""):"Confirmar selecionados")+'</button></div>';
}
/* marcar/desmarcar age sobre o que está VISÍVEL: com um filtro ligado, o que
   se espera é marcar aquele recorte, não o arquivo inteiro */
function marcarTodosImportacao(on){
  impFiltradas().forEach(l=>{ if(!l.erro) l.selecionado=on; });
  impRedesenhaRevisao();
}
/* troca só o miolo: refazer o modal inteiro perderia o foco da busca */
function impRedesenhaRevisao(){
  const box=$("#impBox"); if(box) box.innerHTML=renderListaPreLancamentos();
  impAtualizaContagem();
}
function impAtualizaContagem(){
  const st=$("#impStats"); if(st) st.innerHTML=renderResumoContagem();
  const ft=$("#impFoot"); if(ft) ft.innerHTML=impRodape();
  const ch=$("#impChips"); if(ch) ch.innerHTML=impChips();
}
function openPreEdit(id){
  const l=imp&&imp.linhas.find(x=>x.id===id);
  if(!l) return;
  const cats=l.type==="inc"?S.incCats:S.expCats;
  openModal(modalHead("Editar movimentação",esc(l.descOriginal||""))+
  '<form id="fImpEdit" data-id="'+l.id+'">'+
  '<label>Descrição</label><input id="ieDesc" value="'+esc(l.desc)+'" required>'+
  '<div class="row2" style="margin-top:12px">'+
    '<div><label>Data</label><input id="ieData" type="date" value="'+esc(l.data)+'" required></div>'+
    '<div><label>Valor</label><input id="ieVal" inputmode="decimal" value="'+
      esc(String(l.amount).replace(".",","))+'" required></div></div>'+
  '<label style="margin-top:12px">Tipo</label><select id="ieTipo">'+
    '<option value="exp"'+(l.type==="exp"?" selected":"")+'>Gasto</option>'+

  '<div class="help">Cartão e ticket não entram por aqui: o extrato é da conta, e a fatura do cartão se paga em Carteira.</div>'+

  '<button class="btn" type="submit" style="margin-top:16px">Salvar</button></form>'+
  '<div class="act-row"><button type="button" class="btn small ghost" data-action="imp-voltar">Voltar sem salvar</button></div>');
}
/* sem "criar nova categoria": a importação escolhe entre o que já existe */
function impCatOptions(tipo,sel){
  const cats=tipo==="inc"?S.incCats:S.expCats;
  return '<option value="">— sem categoria —</option>'+
    cats.map(c=>'<option value="'+esc(c)+'"'+(c===sel?" selected":"")+'>'+esc(c)+'</option>').join("");
}
function renderResumoImportacao(){
  const r=imp.resultado||{};
  const li=(t,s)=>'<div class="ni"><b>'+t+'</b><span>'+s+'</span></div>';
  const pl=(n,a,b)=>n+" "+(n>1?b:a);
  return modalHead("Importação concluída","Os lançamentos já estão no seu financeiro")+
  '<div class="news">'+
  li(pl(r.criados,"lançamento importado","lançamentos importados"),"Entraram como pagos, na data do extrato.")+
  (r.dup?li(pl(r.dup,"ignorado","ignorados"),"Possíveis duplicados que ficaram desmarcados."):"")+
  (r.semcat?li(pl(r.semcat,"sem categoria","sem categoria"),"Entraram em Outros — dá para ajustar na lista de lançamentos."):"")+
  (r.erro?li(pl(r.erro,"com erro","com erro"),"Linhas que o arquivo não deixou entender. Nada foi criado para elas."):"")+
  '</div>'+
  '<button class="btn" data-action="fechar-importacao">Concluir</button>'+
  '<div class="act-row"><button type="button" class="btn small ghost" data-action="desfazer-importacao">Desfazer importação</button></div>';
}
