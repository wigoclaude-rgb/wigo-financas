let tour=null, tourStep=0;
const tourEl=s=>[...document.querySelectorAll('[data-tour="'+s+'"]')]
  .find(e=>e.offsetParent!==null&&e.getBoundingClientRect().width>0);

function startTour(lista,marca){
  tour={ passos:lista, marca }; tourStep=0;
  closeModal();
  renderTour();
}
function endTour(){
  if(tour&&tour.marca){ S[tour.marca]=true; save(); }
  tour=null;
  const w=document.getElementById("tourWrap"); if(w) w.remove();
}
function renderTour(){
  if(!tour) return;
  // pula passos cujo alvo não existe nesta tela
  while(tourStep<tour.passos.length){
    const p=tour.passos[tourStep];
    if(p.tab&&tab!==p.tab){ tab=p.tab; homeFlt=null; render(); }
    /* abre (ou fecha) a tela que o passo precisa mostrar — é o que permite
       explicar os campos do formulário de lançamento por dentro.
       Passos cujo alvo não é campo de formulário fecham o que estiver aberto,
       para não deixar a tela presa ao voltar um passo. */
    if(p.abre){ try{ p.abre(); }catch(e){} }
    else if(p.fecha||!(p.sel||"").startsWith("f-")) closeModal();
    if(!p.sel||tourEl(p.sel)) break;
    tourStep++;
  }
  if(tourStep>=tour.passos.length){ endTour(); toast("Tutorial concluído ✓"); return; }

  const p=tour.passos[tourStep];
  const alvo=p.sel?tourEl(p.sel):null;
  let w=document.getElementById("tourWrap");
  if(!w){ w=document.createElement("div"); w.id="tourWrap"; document.body.appendChild(w); }

  const ultimo=tourStep===tour.passos.length-1;
  const dots=tour.passos.map((_,i)=>'<i class="'+(i===tourStep?"on":"")+'"></i>').join("");
  /* com alvo, quem escurece é o próprio recorte — sua sombra abre um buraco
     real sobre o elemento. Somar a máscara por cima escureceria justamente o
     que se quer mostrar. */
  w.innerHTML=(alvo?'<div class="t-ring"></div>':'<div class="t-mask"></div>')+
    '<div class="t-box'+(alvo?"":" mid")+'">'+
      '<div class="t-h">'+esc(p.t)+'</div>'+
      '<div class="t-b">'+p.b+'</div>'+
      '<div class="t-f"><div class="t-dots">'+dots+'</div>'+
        '<div class="t-btns">'+
          (tourStep>0?'<button class="btn xs ghost" data-action="tour-prev">Voltar</button>':
            '<button class="btn xs ghost" data-action="tour-end">Pular</button>')+
          '<button class="btn xs" data-action="'+(ultimo?"tour-end":"tour-next")+'">'+
            (ultimo?"Concluir":"Próximo")+'</button>'+
        '</div></div></div>';

  if(alvo){
    alvo.scrollIntoView({block:"center",behavior:"instant"});
    /* posiciona já, e reajusta no quadro seguinte para pegar a rolagem que
       acabou de acontecer. A chamada direta importa porque requestAnimationFrame
       não dispara com a aba em segundo plano, e o recorte ficaria sem posição. */
    posicionaTour(alvo,p.place||"bottom");
    requestAnimationFrame(()=>{ const a=p.sel?tourEl(p.sel):null;
      if(a) posicionaTour(a,p.place||"bottom"); });
  }
}
/* Coloca o recorte sobre o alvo e o balão no lado que couber. */
function posicionaTour(alvo,lado){
  const w=document.getElementById("tourWrap"); if(!w) return;
  const ring=w.querySelector(".t-ring"), box=w.querySelector(".t-box");
  if(!ring||!box) return;
  const r=alvo.getBoundingClientRect(), pad=6;
  ring.style.cssText="top:"+(r.top-pad)+"px;left:"+(r.left-pad)+"px;"+
    "width:"+(r.width+pad*2)+"px;height:"+(r.height+pad*2)+"px";

  const bw=Math.min(340,innerWidth-24), gap=14;
  box.style.width=bw+"px";
  const bh=box.offsetHeight;
  let top,left;
  const cabeDireita=r.right+gap+bw<innerWidth;
  const cabeAbaixo=r.bottom+gap+bh<innerHeight;
  if(lado==="right"&&cabeDireita){ left=r.right+gap; top=Math.max(12,r.top); }
  else if(lado==="top"&&r.top-gap-bh>0){ left=r.left; top=r.top-gap-bh; }
  else if(cabeAbaixo){ left=r.left; top=r.bottom+gap; }
  else if(r.top-gap-bh>0){ left=r.left; top=r.top-gap-bh; }
  else { left=(innerWidth-bw)/2; top=innerHeight-bh-20; }
  left=Math.max(12,Math.min(left,innerWidth-bw-12));
  top=Math.max(12,Math.min(top,innerHeight-bh-12));
  box.style.top=top+"px"; box.style.left=left+"px";
}

/* Decide o que mostrar ao abrir o app. Uma coisa de cada vez: quem acabou de
   chegar não precisa saber o que mudou numa versão que nunca usou. */
function decidirOnboarding(){
  if(!S) return;
  // 1) primeiro acesso: tutorial completo
  if(!S.tutorialSeen){
    // quem já chega com dados (conta antiga) não precisa do tour de boas-vindas
    if(!aTx().length){ startTour(TOUR_COMPLETO,"tutorialSeen"); return; }
    S.tutorialSeen=true; S.seenVersion=S.seenVersion||null; save();
  }
  // 2) já usa o app e ainda não viu as novidades desta versão
  if(S.seenVersion!==APP_VERSION){ openWhatsNew(true); return; }
  // 3) já tem dados suficientes para o tour avançado fazer sentido
  if(!S.tourAdvSeen&&aTx().length>=3&&(S.cards.length||S.tickets.length)){
    startTour(TOUR_ADV,"tourAdvSeen");
  }
}

function openCatDetail(cat){
  const val=t=>t.paid?(t.payAmt??t.amount):t.amount;
  const months=[]; let tot=0,mxx=1;
  for(let i=5;i>=0;i--){ const mk=addMonthsISO(viewMonth+"-01",-i).slice(0,7);
    const v=sum(txEffMonth(mk).filter(t=>t.type==="exp"&&t.dest!=="savings"&&t.cat===cat),val);
    months.push([mk,v]); tot+=v; mxx=Math.max(mxx,v); }
  const media=tot/6;
  const mks=months.map(([mk])=>mk);
  const win=aTx().filter(t=>t.type==="exp"&&t.dest!=="savings"&&t.cat===cat&&mks.includes(effMonth(t)));
  const byVal=win.slice().sort((a,b)=>val(b)-val(a));

  const list=win.slice().sort((a,b)=>a.due<b.due?1:-1).slice(0,40);

      '<div class="stat mini"><div class="k">Média mensal</div><div class="v">'+fmt(media)+'</div></div>'+
      '<div class="stat mini"><div class="k">Total 6 meses</div><div class="v">'+fmt(tot)+'</div></div></div>'+
    months.map(([mk,v])=>'<div class="bar-row"><div class="bl"><span class="n" style="text-transform:capitalize">'+shortMonth(mk)+'</span><span class="v">'+fmt(v)+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(v/mxx*100)+'%"></div></div></div>').join("")+
    (hi?'<div class="help" style="margin:10px 0 0">Maior lançamento: <b>'+esc(hi.desc)+'</b> ('+fmt(val(hi))+') · Menor: <b>'+esc(lo.desc)+'</b> ('+fmt(val(lo))+')</div>':"")+

function openMonthDetail(mk){
  const val=t=>t.paid?(t.payAmt??t.amount):t.amount;
  const em=txEffMonth(mk);
  const incL=em.filter(t=>t.type==="inc"), expL=em.filter(t=>t.type==="exp"&&t.dest!=="savings");
  const inc=sum(incL,val), exp=sum(expL,val);
  const by={}; expL.forEach(t=>{ by[t.cat]=(by[t.cat]||0)+val(t); });
  const byE=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const byM={}; expL.forEach(t=>{ const k=METHODS[t.method]||t.method||"Outros"; byM[k]=(byM[k]||0)+val(t); });
  const byME=Object.entries(byM).sort((a,b)=>b[1]-a[1]);
  let tot=0,n=0;
  for(let i=1;i<=6;i++){ const k=addMonthsISO(mk+"-01",-i).slice(0,7);
    const e=sum(txEffMonth(k).filter(t=>t.type==="exp"&&t.dest!=="savings"),val); if(e>0){tot+=e;n++;} }
  const media=n?tot/n:0; const dif=media?Math.round((exp-media)/media*100):null;
  openModal(modalHead("Detalhes de "+monthLabel(mk),"receitas × gastos · saldo do mês")+
    '<div class="grid3" style="margin-bottom:12px">'+
      '<div class="stat mini"><div class="k">Receitas</div><div class="v green">'+fmt(inc)+'</div></div>'+
      '<div class="stat mini"><div class="k">Gastos</div><div class="v red">'+fmt(exp)+'</div></div>'+
      '<div class="stat mini"><div class="k">Saldo</div><div class="v '+(inc-exp>=0?"green":"red")+'">'+fmt(inc-exp)+'</div></div></div>'+
    (dif!=null?'<div class="help" style="margin-bottom:6px">Gastos '+(dif>=0?"+":"")+dif+'% em relação à média dos 6 meses anteriores ('+fmt(media)+'/mês).</div>':"")+
    (byE.length?'<h3 style="font-size:13.5px;color:var(--violet-soft);margin:12px 0 6px">Por categoria</h3>'+bars(byE,exp):"")+
    (byME.length?'<h3 style="font-size:13.5px;color:var(--violet-soft);margin:16px 0 6px">Por forma de pagamento</h3>'+bars(byME,exp,"green"):"")+
    (!byE.length&&!incL.length?'<div class="empty">Sem lançamentos neste mês.</div>':""));
}

/* lista da fatura do mês, filtrada pela busca.
   A busca aceita texto (descrição/categoria) e número: digitar 90 acha
   90,00 / 189,90 / 1.900 — casa contra o valor formatado e o cru. */
let cardQ="";
function cardFatList(id){
  let list=aTx().filter(t=>t.cardId===id&&t.type==="exp"&&mkey(t.due)===viewMonth);
  const total=list.length;
  const q=cardQ.trim().toLowerCase();
  if(q){
    const num=q.replace(/[^\d,.]/g,"").replace(/\./g,"").replace(",",".");
    list=list.filter(t=>{
      if((t.desc+" "+(t.cat||"")).toLowerCase().includes(q)) return true;
      if(!num) return false;
      const cru=String(t.amount), br=t.amount.toFixed(2).replace(".",",");
      return cru.includes(num)||br.includes(q.replace(/[^\d,]/g,""))||fmt(t.amount).toLowerCase().includes(q);
    });
  }
  list.sort((a,b)=>a.due<b.due?-1:1);
  if(!list.length) return '<div class="empty">'+(q?"Nada encontrado para “"+esc(cardQ)+"”.":"Nenhuma compra em "+shortMonth(viewMonth)+".")+'</div>';
  const soma=sum(list);
  return (q?'<div class="help" style="margin-bottom:8px">'+list.length+' de '+total+' · soma <b>'+fmt(soma)+'</b></div>':"")+
    '<div class="list-plain">'+list.map(t=>txRow(t)).join("")+'</div>';
}

function download(name,content,type){ const blob=new Blob([content],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function exportCSV(){
  const head=["Tipo","Descrição","Categoria","Forma","Cartão/Ticket","Parcela","Vencimento","Status","Data pagamento","Valor","Valor pago/recebido"];
  const clean=v=>String(v??"").replace(/;/g,",");
  const rows=aTx().sort((a,b)=>a.due<b.due?-1:1).map(t=>{
    const w=t.cardId?cardOf(t.cardId):(t.ticketId?ticketOf(t.ticketId):null);
    const wn=w?(w.nick||w.name):""; const s=statusOf(t);
    const tipo=t.dest==="savings"?"Poupança":(t.type==="inc"?"Receita":"Gasto");
    return [tipo,clean(t.desc),clean(t.cat),METHODS[t.method]||t.method,clean(wn),
      t.kind==="avista"?"":(t.i+"/"+t.n),fmtDate(t.due),stLabel(t),t.payDate?fmtDate(t.payDate):"",
      String(t.amount).replace(".",","),t.payAmt!=null?String(t.payAmt).replace(".",","):""].join(";"); });
  download("WIGO_lancamentos.csv","\uFEFF"+head.join(";")+"\r\n"+rows.join("\r\n"),"text/csv;charset=utf-8");
  toast("Planilha exportada ✓");
}

    case "flt-clear": resetFilters(); render(); break;

      aTx().forEach(t=>{ if(t.cardId===id&&t.type==="exp"&&mkey(t.due)===viewMonth&&t.paid) undoPaid(t); });
      save(); openCardDetail(id); render(); toast("Pagamento desfeito"); break; }
    case "tx-sel": { if(selTx.has(id)) selTx.delete(id); else selTx.add(id);
      el.classList.toggle("on",selTx.has(id)); updateSelBar(); break; }

      redesenhaDet($("#detBox")); break; }
    case "det-all": { const l=pesDetLista(id);
      if(l.every(t=>detSel.has(t.id))) l.forEach(t=>detSel.delete(t.id));
      else l.forEach(t=>detSel.add(t.id));
      redesenhaDet($("#detBox")); break; }
    case "det-unlink": { const n=detSel.size; if(!n)break;
      if(!confirm("Tirar "+n+" lançamento"+(n>1?"s":"")+" desta pessoa?\n\nOs lançamentos continuam existindo — só deixam de ser dela."))break;
      detSel.forEach(tid=>{ const t=S.tx.find(x=>x.id===tid); if(t) t.pesId=null; });
      detSel.clear(); save(); render(); openPesDetail(id);
      toast(n+" lançamento"+(n>1?"s":"")+" desvinculado"+(n>1?"s":"")); break; }
    /* atribuir a pessoa aos lançamentos selecionados na lista */
    case "sel-pes": { if(!selTx.size)break;
      if(!S.people.length){ toast("Cadastre uma pessoa primeiro"); openPesForm(); break; }
      const opts=S.people.map((p,i)=>(i+1)+") "+p.name).join("\n");
      const r=(prompt("Vincular "+selTx.size+" lançamento(s) a quem?\n\n"+opts+"\n\n0) Ninguém — remover vínculo","1")||"").trim();
      if(r==="")break;
      const n=parseInt(r);
      if(isNaN(n)||n<0||n>S.people.length){ toast("Opção inválida"); break; }
      const pid=n===0?null:S.people[n-1].id;
      let c=0; selTx.forEach(sid=>{ const t=S.tx.find(x=>x.id===sid); if(t&&t.type!=="xfer"){ t.pesId=pid; c++; } });
      selTx.clear(); save(); render();
      toast(c+" lançamento"+(c>1?"s":"")+(pid?" vinculado"+(c>1?"s":""):" desvinculado"+(c>1?"s":""))); break; }
    case "pes-pdf": { const p=pesOf(id); if(!p)break;
      /* leva o nome para o relatório já filtrado em aberto — o caso de uso é cobrar */
      rep.q=p.name; rep.scope="all"; rep.status="open"; rep.type="all"; rep.group="none"; rep.detail=1;
      closeModal(); setTimeout(printReport,220); break; }
    // saldo de abertura
    case "open-set": openOpening(); break;
    case "open-clear": { S.opening=null; save(); closeModal(); render(); toast("Abertura removida"); break; }
    case "month-detail": openMonthDetail(el.dataset.mk); break;
    case "sel-pay": { let n=0; const today=todayISO();
      selTx.forEach(sid=>{ const t=S.tx.find(x=>x.id===sid); if(t&&!t.paid){ applyPaid(t,today,t.amount); n++; } });
      selTx.clear(); save(); closeModal(); render(); toast(n+" lançamento(s) baixado(s) ✓"); break; }
    case "sel-clear": { selTx.clear();
      document.querySelectorAll(".selc.on").forEach(c=>c.classList.remove("on")); updateSelBar(); break; }
    case "tx-paid": openPaid(id); break;
    case "tx-unpaid": { const t=S.tx.find(x=>x.id===id); if(t){ undoPaid(t); save(); closeModal(); render(); toast("Desfeito"); } break; }
    case "tx-edit": openEdit(id); break;
    case "tx-mirror": openMirror(id); break;
    // seleção de faturas na Carteira
    case "card-pick": { selCards.has(id)?selCards.delete(id):selCards.add(id); render(); break; }
    case "card-pick-all": { if(S.cards.every(c=>selCards.has(c.id))) selCards.clear();
      else S.cards.forEach(c=>selCards.add(c.id)); render(); break; }
    case "card-pick-clear": selCards.clear(); render(); break;
    // exclusão (reversível — vai para a Lixeira)
    case "tx-delete": openDelete(id); break;
    case "del-do": { const t=S.tx.find(x=>x.id===id); if(!t)break;
      const grp=aTx().filter(x=>x.gid===t.gid);
      const alvo=el.dataset.mode==="group"?grp
        :el.dataset.mode==="open"?grp.filter(x=>!x.paid)
        :[t];
      const n=markDeleted(alvo);
      save(); closeModal(); render();
      toast(n+" lançamento"+(n>1?"s":"")+" na lixeira"); break; }
    case "del-pick-all": { const cx=document.querySelectorAll('input[name="delpick"]');
      const todos=[...cx].every(c=>c.checked); cx.forEach(c=>c.checked=!todos);
      el.textContent=todos?"Marcar todos":"Desmarcar todos"; break; }
    // lixeira
    case "rep-pdf": openReportPdf(); break;
    case "open-set": openOpening(); break;
    case "open-clear": { S.opening=null; save(); closeModal(); render(); toast("Abertura removida"); break; }
    case "trash-open": openTrash(); break;
    case "trash-restore": { const t=S.tx.find(x=>x.id===id); if(!t)break;
      restoreTx([t]); save(); render(); openTrash(); toast("Restaurado ✓"); break; }
    case "trash-restore-all": { const n=restoreTx(delTx());
      save(); closeModal(); render(); toast(n+" restaurado"+(n>1?"s":"")+" ✓"); break; }
    case "trash-purge": { const n=delTx().length;
      if(!confirm("Apagar definitivamente "+n+" lançamento"+(n>1?"s":"")+" da lixeira?\n\nEsta ação não pode ser desfeita."))break;
      S.tx=aTx(); save(); closeModal(); render(); toast("Lixeira esvaziada"); break; }
    case "trash-purge-one": { if(!confirm("Apagar este lançamento definitivamente?"))break;
      S.tx=S.tx.filter(x=>x.id!==id); save(); render(); openTrash(); toast("Apagado"); break; }
    // cartões
    case "card-add": openCardForm(); break;
    case "card-open": openCardDetail(id); break;
    case "card-edit": openCardForm(id); break;
    case "card-delete": { const inUse=S.tx.some(t=>t.cardId===id);
      if(!confirm(inUse?"Cartão tem lançamentos. Excluir mesmo? (lançamentos ficam sem cartão)":"Excluir cartão?"))break;
      S.cards=S.cards.filter(c=>c.id!==id);
      S.tx.forEach(t=>{ if(t.cardId===id){ t.cardId=null; if(t.method==="cartao")t.method="boleto"; }});
      save(); closeModal(); render(); toast("Cartão excluído"); break; }
    case "pick-color": cardColor=el.dataset.c; document.querySelectorAll('[data-action="pick-color"]').forEach(b=>b.classList.toggle("on",b.dataset.c===cardColor)); break;
    // tickets
    case "ticket-add": openTicketForm(); break;
    case "ticket-open": openTicketDetail(id); break;
    case "ticket-edit": openTicketForm(id); break;
    case "ticket-delete": { const inUse=S.tx.some(t=>t.ticketId===id);
      if(!confirm(inUse?"Ticket tem gastos. Excluir mesmo?":"Excluir ticket?"))break;
      S.tickets=S.tickets.filter(t=>t.id!==id);
      S.tx.forEach(t=>{ if(t.ticketId===id){ t.ticketId=null; if(t.method==="ticket")t.method="debito"; }});
      save(); closeModal(); render(); toast("Ticket excluído"); break; }
    case "pick-tcolor": ticketColor=el.dataset.c; document.querySelectorAll('[data-action="pick-tcolor"]').forEach(b=>b.classList.toggle("on",b.dataset.c===ticketColor)); break;
    // poupança
    case "goal-add": openGoalForm(); break;
    case "goal-open": openGoalDetail(id); break;
    case "goal-edit": openGoalForm(id); break;
    case "goal-delete": { const g=goalOf(id);
      if(!confirm("Excluir a poupança \""+(g?g.name:"")+"\"? As movimentações serão perdidas."))break;
      S.goals=S.goals.filter(x=>x.id!==id);
      S.tx.forEach(t=>{ if(t.goalId===id)t.goalId=null; }); save(); closeModal(); render(); toast("Poupança excluída"); break; }
    case "goal-deposit": openMoveForm(id,"in"); break;
    case "goal-withdraw": openMoveForm(id,"out"); break;
    case "move-del": { const g=goalOf(el.dataset.gid); if(g&&g.moves){ g.moves=g.moves.filter(mv=>mv.id!==id); save(); openGoalDetail(el.dataset.gid); } break; }
    case "goal-launch-month": { const g=goalOf(id); if(!g)break;
      const due=viewMonth+"-"+String(new Date().getDate()).padStart(2,"0");
      createTx({type:"exp",dest:"savings",desc:"Poupança: "+g.name,cat:"Poupança",method:"transferencia",goalId:g.id,kind:"avista",total:g.monthly,firstDue:due});
      save(); render(); toast("Meta lançada em "+shortMonth(viewMonth)); break; }
    // conta
    case "acc-email": openAccEmail(); break;
    case "acc-pass": openAccPass(); break;
    case "acc-reset": try{ await sendPasswordResetEmail(auth,user.email); toast("Link enviado para "+user.email); }catch(err){ toast(authErr(err)); } break;
    case "acc-logout": if(confirm("Sair da conta?")) await signOut(auth); break;
    // categorias
    case "cat-add": { const nm=prompt("Nome da nova categoria:"); if(!nm)break;
      const arr=el.dataset.t==="inc"?S.incCats:S.expCats; if(!arr.includes(nm.trim()))arr.push(nm.trim());
      save(); render(); toast("Categoria criada"); break; }
    case "cat-del": { const cName=el.dataset.c;
      if(S.tx.some(t=>t.cat===cName)){ toast("Categoria em uso"); break; }
      if(el.dataset.t==="inc")S.incCats=S.incCats.filter(x=>x!==cName); else S.expCats=S.expCats.filter(x=>x!==cName);
      save(); render(); break; }
    // backup
    case "backup-export": exportBackup(); break;
    /* ----- importar extrato ----- */
    case "abrir-importacao": abrirImportacao(); break;
    case "imp-escolher": { const inp=$("#impArquivo"); if(inp) inp.click(); break; }
    case "fechar-importacao": fecharImportacao(); break;
    case "descartar-importacao": descartarImportacao(); break;
    case "confirmar-importacao": confirmarPreLancamentos(); break;
    case "marcar-todos-importacao": marcarTodosImportacao(el.dataset.v==="1"); break;
    case "imp-flt": if(imp){ imp.flt=el.dataset.v; impRedesenhaRevisao(); } break;
    case "editar-pre-lancamento": openPreEdit(id); break;
    case "imp-voltar": if(imp){ imp.etapa="revisao"; renderImportacao(); } break;
    case "desfazer-importacao": desfazerUltimaImportacao(); break;
    case "backup-import": $("#importFile").click(); break;
    case "csv-export": exportCSV(); break;
    // settings gear
    case "open-settings": tab="settings"; render(); break;
  }
  }catch(err){ console.error(err); toast("Ops, algo deu errado"); }
});

/* debounce busca */
let searchTimer=null;
document.addEventListener("input", e=>{
  if(e.target.id==="cmdInput"){ renderCmd(e.target.value); return; }
  /* busca dentro da fatura: troca só a lista, para o campo não perder o foco */
  if(e.target.id==="cardSearch"){ cardQ=e.target.value;
    const box=$("#cardListBox"); if(box) box.innerHTML=cardFatList(e.target.dataset.card);
    return; }
  if(e.target.id==="vincSearch"){ vincQ=e.target.value;
    const box=$("#vincBox"); if(box) box.innerHTML=vincList(e.target.dataset.pes);
    return; }
  if(e.target.id==="pesSearch"){ pesQ=e.target.value;
    const box=$("#pesBox"); if(box){ box.innerHTML=peopleBody();
      const i=$("#pesSearch"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
    return; }
  if(e.target.id==="detSearch"){ detQ=e.target.value;
    redesenhaDet($("#detBox"));
    const i=$("#detSearch"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
    return; }
  if(e.target.id==="impBusca"&&imp){ imp.q=e.target.value; impRedesenhaRevisao(); return; }
  if(e.target.id==="fltQ"){ clearTimeout(searchTimer);
    const val=e.target.value; searchTimer=setTimeout(()=>{ filters.q=val;
      // re-render mantendo foco
      render(); const inp=$("#fltQ"); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
    },250); }
});

document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="txMethod"){ syncAddForm(); autoDueFromCard(); }
  if(t.id==="edMethod"){ const isC=t.value==="cartao", isT=t.value==="ticket";
    if(isC&&!S.cards.length){ toast("Cadastre um cartão primeiro"); t.value="pix"; }
    else if(isT&&!S.tickets.length){ toast("Cadastre um ticket primeiro"); t.value="pix"; }
    const on=t.value==="cartao"||t.value==="ticket";
    if($("#edWrapWallet")) $("#edWrapWallet").classList.toggle("hidden",!on);
    if($("#edLblWallet")) $("#edLblWallet").textContent=t.value==="ticket"?"Ticket":"Cartão"; }
  if(t.id==="txPerp"){ syncAddForm(); }
  /* cadastrar pessoa sem sair do formulário: o que já foi digitado se mantém */
  if((t.id==="txPes"||t.id==="edPes")&&t.value==="__new"){
    const nome=(prompt("Nome da pessoa:")||"").trim();
    if(nome){
      const p={id:uid(),name:nome,note:""};
      S.people.push(p); save();
      const novo='<option value="'+p.id+'">'+esc(p.name)+'</option>';
      t.insertAdjacentHTML("beforeend",novo);
      t.querySelectorAll('option[value="__new"]').forEach(o=>t.appendChild(o)); // mantém por último
      t.value=p.id;
      toast("Pessoa cadastrada ✓");
    } else t.value="";
  }
  if(t.id==="rpScope"&&$("#rpRange")) $("#rpRange").classList.toggle("hidden",t.value!=="range");
  if(t.id==="edKind"){ const f=$("#fEdit"); const tx=f&&S.tx.find(x=>x.id===f.dataset.id);
    if(tx){ const changed=t.value!==tx.kind;
      if($("#edWrapParc")) $("#edWrapParc").classList.toggle("hidden",!(changed&&t.value==="parcelado"));
      if($("#edWrapFixo")) $("#edWrapFixo").classList.toggle("hidden",!(changed&&t.value==="fixo"));
      if($("#edKindHelp")) $("#edKindHelp").classList.toggle("hidden",!changed); } }
  if(t.id==="txWallet"||t.id==="txBuy") autoDueFromCard();
  if(t.id==="fltCard"||t.dataset.role==="fcard"){ filters.card=t.value; render(); }
  if(t.id==="fltCat"||t.dataset.role==="fcat"){ filters.cat=t.value; render(); }
  if(t.id==="cdNoLimit"){ cardNoLimit=t.checked;
    $("#cdLimitWrap").classList.toggle("hidden",cardNoLimit);
    $("#cdCloseWrap").classList.toggle("hidden",cardNoLimit); }
  if(t.id==="txCat"&&t.value==="__new"){ const nm=prompt("Nome da nova categoria:");
    const arr=addType==="inc"?S.incCats:S.expCats; if(nm&&!arr.includes(nm.trim()))arr.push(nm.trim());
    save(); t.innerHTML=catOptions(addType,nm?nm.trim():undefined); }
  if(t.id==="edCat"&&t.value==="__new"){ const f=$("#fEdit"); const tx=S.tx.find(x=>x.id===f.dataset.id);
    const nm=prompt("Nome da nova categoria:"); const arr=tx.type==="inc"?S.incCats:S.expCats;
    if(nm&&!arr.includes(nm.trim()))arr.push(nm.trim());
    save(); t.innerHTML=catOptions(tx.type,nm?nm.trim():tx.cat); }
  if(t.id==="impArquivo"){ const arq=t.files[0]; t.value=""; processarArquivoImportacao(arq); }
  if(t.id==="impConta"&&imp){ imp.contaId=t.value;
    /* trocar a conta refaz a duplicidade: o mesmo valor em outra conta é outro
       lançamento, e o que era duplicado ali pode não ser aqui */
    imp.linhas.forEach(l=>{ if(l.erro) return;
      l.accId=t.value;
      const r=ehDuplicadoImportacao({data:l.data,amount:l.amount,desc:l.desc,fitid:l.fitid},t.value,null);
      l.duplicado=r.dup; l.chave=r.chave; l.motivo=r.motivo;
      l.igualId=r.igual?r.igual.id:null; l.selecionado=!r.dup; });
    if(imp.etapa==="revisao") impRedesenhaRevisao(); }
  if(t.name==="impSel"&&imp){ const l=imp.linhas.find(x=>x.id===t.dataset.id);
    if(l){ l.selecionado=t.checked; impAtualizaContagem(); } }
  if(t.id==="ieTipo"&&imp){ const fe=$("#fImpEdit");
    const l=fe&&imp.linhas.find(x=>x.id===fe.dataset.id);
    if($("#ieCat")) $("#ieCat").innerHTML=impCatOptions(t.value,l?l.cat:""); }
  if(t.id==="importFile"){ const f=t.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p.tx)throw 0;
        if(!confirm("Importar backup? Substitui os dados atuais."))return;
        S=Object.assign(defaultState(),p); S.cards=p.cards||[]; S.tickets=p.tickets||[]; S.goals=p.goals||[]; S.tx=p.tx||[];
      S.accounts=p.accounts||[]; S.people=p.people||[];
        save(); updateAppName(); render(); toast("Backup importado ✓");
      }catch{ toast("Arquivo inválido"); } };
    r.readAsText(f); t.value=""; }
});

document.addEventListener("submit", async e=>{
  e.preventDefault(); const f=e.target;
  try{
  if(f.id==="authForm"){ const em=$("#authEmail").value.trim(), ps=$("#authPass").value; $("#authMsg").className="auth-msg";
    try{ if(authMode==="reg"){ if(ps!==$("#authPass2").value){ authMsg("As senhas não conferem."); return; }
        await createUserWithEmailAndPassword(auth,em,ps); }
      else await signInWithEmailAndPassword(auth,em,ps);
    }catch(err){ authMsg(authErr(err)); } }
  else if(f.id==="fTx") submitTx();
  else if(f.id==="fImpCols"){
    if(!imp||!imp.bruto) return;
    const col=x=>{ const el=$(x); const v=el?el.value:""; return v===""?null:+v; };
    const cols={ data:col("#icData"), desc:col("#icDesc"), valor:col("#icValor"),
      debito:col("#icDeb"), credito:col("#icCred"), tipo:col("#icTipo") };
    if(cols.data==null||cols.desc==null){ toast("Escolha as colunas de data e descrição"); return; }
    if(cols.valor==null&&cols.debito==null&&cols.credito==null){
      toast("Escolha a coluna de valor, ou as de débito e crédito"); return; }
    aplicarColunasImportacao(cols); }
  else if(f.id==="fImpEdit"){
    const l=imp&&imp.linhas.find(x=>x.id===f.dataset.id); if(!l) return;
    const v=parseMoney($("#ieVal").value), d=$("#ieData").value;
    if(!v){ toast("Informe um valor válido"); return; }
    if(!d){ toast("Informe uma data válida"); return; }
    l.desc=$("#ieDesc").value.trim()||l.desc;
    l.data=d; l.amount=Math.abs(v);
    l.type=$("#ieTipo").value; l.cat=$("#ieCat").value;
    l.method=$("#ieMet").value; l.accId=$("#ieAcc").value;
    l.erro=null; l.selecionado=true;
    /* a marca de origem identifica a LINHA DO ARQUIVO, e não o resultado da
       edição: se mudasse aqui, reimportar o mesmo extrato deixaria de
       reconhecer o que já entrou e criaria tudo de novo. Só é calculada agora
       quando a linha nasceu com erro e nunca chegou a ter uma. */
    if(!l.chave) l.chave=l.fitid||gerarHashImportacao(
      l.accId+"|"+l.data+"|"+l.amount.toFixed(2)+"|"+normalizarTextoImportacao(l.desc));
    imp.etapa="revisao"; renderImportacao(); toast("Movimentação atualizada ✓"); }
  else if(f.id==="fAcc"){
    const id=f.dataset.id;
    const v=$("#acAmt").value.trim();
    const abertura=v?{ amount:(v.startsWith("-")?-1:1)*parseMoney(v.replace("-","")),
      month:$("#acMonth").value||viewMonth }:null;
    const dados={ name:$("#acName").value.trim()||"Conta", bank:$("#acBank").value,
      type:$("#acType").value, color:accColor, opening:abertura };
    if(id){ Object.assign(accOf(id),dados); }
    else { S.accounts.push(Object.assign({id:uid()},dados)); }
    save(); closeModal(); render(); toast(id?"Conta salva ✓":"Conta adicionada ✓"); }
  else if(f.id==="fXfer"){
    const de=$("#xfDe").value, para=$("#xfPara").value;
    if(de===para){ toast("Escolha contas diferentes"); return; }
    const v=parseMoney($("#xfVal").value);
    if(!v){ toast("Informe um valor válido"); return; }
    const d=$("#xfData").value||todayISO();
    /* transferência nasce já concluída: o dinheiro trocou de lugar na hora */
    S.tx.push({ id:uid(), gid:uid(), type:"xfer", dest:null,
      desc:$("#xfDesc").value.trim()||("Transferência "+accOf(de).name+" → "+accOf(para).name),
      cat:"Transferência", method:"transferencia", cardId:null, ticketId:null, goalId:null,
      accId:de, accTo:para, pesId:null, kind:"avista", i:1, n:1, amount:v,
      due:d, comp:null, paid:true, payDate:d, payAmt:v });
    save(); closeModal(); render(); toast("Transferido ✓"); }
  else if(f.id==="fVincular"){
    const pesId=f.dataset.id;
    const marcados=new Set([...document.querySelectorAll('input[name="vinc"]:checked')].map(c=>c.value));
    const visiveis=[...document.querySelectorAll('input[name="vinc"]')].map(c=>c.value);
    let add=0,rem=0;
    visiveis.forEach(id=>{
      const t=S.tx.find(x=>x.id===id); if(!t)return;
      if(marcados.has(id)){ if(t.pesId!==pesId){ t.pesId=pesId; add++; } }
      else if(t.pesId===pesId){ t.pesId=null; rem++; }
    });
    save(); closeModal(); render(); openPesDetail(pesId);
    toast(add||rem?(add?add+" vinculado"+(add>1?"s":""):"")+(add&&rem?" · ":"")+(rem?rem+" removido"+(rem>1?"s":""):""):"Nada mudou"); }
  else if(f.id==="fPes"){
    const id=f.dataset.id;
    const dados={ name:$("#peName").value.trim()||"Sem nome", note:$("#peNote").value.trim() };
    if(id){ Object.assign(pesOf(id),dados); }
    else { S.people.push(Object.assign({id:uid()},dados)); }
    save(); closeModal(); render(); openPeople(); toast(id?"Pessoa salva ✓":"Pessoa adicionada ✓"); }
  else if(f.id==="fOpening"){
    const v=$("#opAmt").value.trim();
    const neg=v.startsWith("-");
    const amt=(neg?-1:1)*parseMoney(v.replace("-",""));
    S.opening={ amount:amt||0, month:$("#opMonth").value||viewMonth };
    save(); closeModal(); render(); toast("Saldo de abertura salvo ✓"); }
  else if(f.id==="fRep"){
    rep.q=$("#rpQ").value.trim(); rep.scope=$("#rpScope").value;
    rep.from=$("#rpFrom")?$("#rpFrom").value:""; rep.to=$("#rpTo")?$("#rpTo").value:"";
    rep.status=$("#rpStatus").value; rep.type=$("#rpType").value;
    rep.group=$("#rpGroup").value; rep.detail=$("#rpDetail").checked?1:0;
    const n=repRows().length;
    if(!n){ toast("Nenhum lançamento com esses filtros"); return; }
    closeModal(); setTimeout(printReport,220); }
  else if(f.id==="fDelPick"){
    const ids=[...document.querySelectorAll('input[name="delpick"]:checked')].map(c=>c.value);
    if(!ids.length){ toast("Marque ao menos um"); return; }
    const n=markDeleted(S.tx.filter(x=>ids.includes(x.id)));
    save(); closeModal(); render(); toast(n+" lançamento"+(n>1?"s":"")+" na lixeira"); }
  else if(f.id==="fAdv"){
    filters.min=$("#fvMin").value.trim(); filters.max=$("#fvMax").value.trim();
    filters.from=$("#fdFrom").value; filters.to=$("#fdTo").value;
    filters.method=$("#fMethod").value; filters.kind=$("#fKind").value;
    /* período explícito só faz sentido varrendo tudo, senão o mês exibido corta o resultado */
    if(filters.from||filters.to) filters.scope="all";
    closeModal(); render(); toast("Filtros aplicados ✓"); }
  else if(f.id==="fFatura"){ const cid=f.dataset.id; const dt=$("#ftDate").value||todayISO();
    let n=0; aTx().forEach(t=>{ if(t.cardId===cid&&t.type==="exp"&&mkey(t.due)===viewMonth&&!t.paid){ applyPaid(t,dt,t.amount); n++; } });
    save(); closeModal(); openCardDetail(cid); render(); toast("Fatura paga ✓ ("+n+" lançamentos)"); }
  else if(f.id==="fPaid"){ const t=S.tx.find(x=>x.id===f.dataset.id); if(!t)return;
    applyPaid(t,$("#pdDate").value||todayISO(),parseMoney($("#pdAmt").value)||t.amount);
    save(); closeModal(); render(); toast(t.type==="inc"?"Recebido ✓":(t.dest==="savings"?"Guardado ✓":"Pago ✓")); }
  else if(f.id==="fMirror"){ const t=S.tx.find(x=>x.id===f.dataset.id); if(!t)return;
    const novo=t.type==="inc"?"exp":"inc";
    const val=parseMoney($("#miVal").value); if(!val){ toast("Informe um valor válido"); return; }
    const cat=$("#miCat").value==="__new"?"Outros":$("#miCat").value;
    /* sempre à vista: espelhar um parcelado geraria um segundo grupo de N
       parcelas, que quase nunca é o que se quer ao inverter o sinal */
    createTx({ type:novo, dest:null, desc:$("#miDesc").value.trim()||t.desc, cat,
      method:novo==="inc"?"transferencia":"pix", cardId:null, ticketId:null, goalId:null,
      comp:$("#miComp").value||null, kind:"avista", total:val, n:2, paidCount:0, months:12,
      firstDue:$("#miDue").value||t.due, alreadyPaid:$("#miPaid").checked });
    save(); closeModal(); render(); toast((novo==="inc"?"Receita":"Gasto")+" criado ✓"); }
  else if(f.id==="fEdit"){ const t=S.tx.find(x=>x.id===f.dataset.id); if(!t)return;
    const nDesc=$("#edDesc").value.trim()||t.desc;
    const nCat=($("#edCat")&&$("#edCat").value!=="__new")?$("#edCat").value:t.cat;
    const nVal=$("#edVal")?(parseMoney($("#edVal").value)||t.amount):t.amount;
    const nDue=$("#edDue").value||t.due;
    // resolve forma + cartão/ticket
    let nMethod=t.method,nCard=t.cardId,nTicket=t.ticketId;
    if($("#edMethod")){ const mv=$("#edMethod").value;
      if(mv==="cartao"||mv==="ticket"){ const wv=($("#edWallet")&&$("#edWallet").value)||"";
        if(wv.startsWith("card:")){ nMethod="cartao"; nCard=wv.slice(5); nTicket=null; }
        else if(wv.startsWith("ticket:")){ nMethod="ticket"; nTicket=wv.slice(7); nCard=null; }
        else { nMethod=mv; }
      } else { nMethod=mv; nCard=null; nTicket=null; } }
    // mudou o tipo? recria o grupo inteiro
    if($("#edKind")&&$("#edKind").value!==t.kind){
      const nk=$("#edKind").value; const gid=t.gid; const old=aTx().filter(x=>x.gid===gid);
      if(!confirm("Mudar o tipo recria o grupo ("+old.length+" lançamento(s)) a partir de "+nDue.split("-").reverse().join("/")+", usando "+fmt(nVal)+" como valor total. Pagamentos do grupo serão desfeitos. Continuar?")) return;
      old.forEach(x=>{ if(x.paid) undoPaid(x); });
      S.tx=S.tx.filter(x=>x.gid!==gid);
      createTx({ type:t.type, dest:null, desc:nDesc, cat:nCat, method:nMethod, cardId:nCard, ticketId:nTicket, goalId:null,
        comp:($("#edComp")&&$("#edComp").value)?$("#edComp").value:null,
        kind:nk, total:nVal, n:Math.max(2,parseInt($("#edN")&&$("#edN").value)||2),
        paidCount:Math.max(0,parseInt($("#edPaidN")&&$("#edPaidN").value)||0),
        months:Math.max(2,parseInt($("#edMonths")&&$("#edMonths").value)||12),
        firstDue:nDue, alreadyPaid:false });
      save(); closeModal(); render(); toast("Tipo alterado — grupo recriado ✓"); return; }
    t.desc=nDesc; if($("#edCat")) t.cat=nCat; if($("#edVal")) t.amount=nVal; t.due=nDue;
    t.method=nMethod; t.cardId=nCard; t.ticketId=nTicket;
    if($("#edComp")) t.comp=$("#edComp").value||null;
    if($("#edAcc")) t.accId=$("#edAcc").value||null;
    if($("#edPes")&&$("#edPes").value!=="__new") t.pesId=$("#edPes").value||null;
    if(t.paid&&$("#edPayDate")){ t.payDate=$("#edPayDate").value; t.payAmt=parseMoney($("#edPayAmt").value)||t.amount;
      if(t.dest==="savings"&&t.goalId){ const g=goalOf(t.goalId); if(g&&g.moves){ const mv=g.moves.find(m=>m.txId===t.id); if(mv){ mv.date=t.payDate; mv.amount=t.payAmt; } } } }
    if($("#edApplyAll")&&$("#edApplyAll").checked){ aTx().forEach(x=>{ if(x.gid===t.gid){ x.desc=t.desc; x.cat=t.cat; x.method=t.method; x.cardId=t.cardId; x.ticketId=t.ticketId; } }); }
    save(); closeModal(); render(); toast("Alterações salvas ✓"); }
  else if(f.id==="fCard"){ const noLimit=$("#cdNoLimit").checked;
    const data={ bank:$("#cdBank").value, nick:$("#cdNick").value.trim()||"Meu cartão", color:cardColor, noLimit,
      limit:noLimit?0:parseMoney($("#cdLimit").value),
      closeDay:noLimit?1:Math.min(31,Math.max(1,parseInt($("#cdClose").value)||1)),
      dueDay:Math.min(31,Math.max(1,parseInt($("#cdDue").value)||10)),
      accId:($("#cdAcc")&&$("#cdAcc").value)||null };
    if(f.dataset.id){ Object.assign(cardOf(f.dataset.id),data); toast("Cartão atualizado ✓"); }
    else { S.cards.push(Object.assign({id:uid()},data)); toast("Cartão adicionado ✓"); }
    save(); closeModal(); render(); }
  else if(f.id==="fTicket"){ const data={ brand:$("#tkBrand").value, name:$("#tkName").value.trim()||"Ticket",
      color:ticketColor, monthly:parseMoney($("#tkMonthly").value), day:Math.min(31,Math.max(1,parseInt($("#tkDay").value)||1)) };
    if(f.dataset.id){ Object.assign(ticketOf(f.dataset.id),data); toast("Ticket atualizado ✓"); }
    else { S.tickets.push(Object.assign({id:uid(),overrides:{}},data)); toast("Ticket adicionado ✓"); }
    save(); closeModal(); render(); }
  else if(f.id==="fTicketMonth"){ const tk=ticketOf(f.dataset.id); if(!tk)return;
    tk.overrides=tk.overrides||{}; tk.overrides[viewMonth]=parseMoney($("#tkMonthVal").value);
    save(); openTicketDetail(f.dataset.id); render(); toast("Recarga do mês ajustada ✓"); }
  else if(f.id==="fGoal"){ const data={ name:$("#glName").value.trim()||"Poupança", bank:$("#glBank").value.trim(),
      color:goalColor, goal:parseMoney($("#glGoal").value), monthly:parseMoney($("#glMonthly").value),
      cdi:parseFloat(String($("#glCdi").value).replace(",","."))||0, showHome:$("#glShowHome").checked };
    if(f.dataset.id){ Object.assign(goalOf(f.dataset.id),data); toast("Poupança atualizada ✓"); }
    else { S.goals.push(Object.assign({id:uid(),moves:[]},data)); toast("Poupança criada ✓"); }
    save(); closeModal(); render(); }
  else if(f.id==="fMove"){ const g=goalOf(f.dataset.id); if(!g)return;
    const v=parseMoney($("#mvAmt").value); if(v<=0){ toast("Valor inválido"); return; }
    g.moves=g.moves||[]; g.moves.push({id:uid(),date:$("#mvDate").value||todayISO(),amount:v,kind:f.dataset.kind});
    save(); openGoalDetail(f.dataset.id); render(); toast(f.dataset.kind==="out"?"Retirada registrada ✓":"Depósito registrado ✓"); }
  else if(f.id==="fCdi"){ S.cdiRef=(parseFloat(String($("#inCdi").value).replace(",","."))||14.65)/100; save(); render(); toast("CDI atualizado ✓"); }
  else if(f.id==="fEmail"){ try{ await reauth($("#accPass").value);
      await verifyBeforeUpdateEmail(user,$("#accNewEmail").value.trim()); closeModal(); toast("Confirmação enviada ao novo e-mail"); }
    catch(err){ toast(authErr(err)); } }
  else if(f.id==="fPass"){ if($("#accNewPass").value!==$("#accNewPass2").value){ toast("As senhas não conferem"); return; }
    try{ await reauth($("#accPass").value); await updatePassword(user,$("#accNewPass").value); closeModal(); toast("Senha atualizada ✓"); }
    catch(err){ toast(authErr(err)); } }
  }catch(err){ console.error(err); toast("Ops, algo deu errado"); }
});

$("#sheetWrap").addEventListener("click",e=>{ if(e.target.id==="sheetWrap") closeModal(); });
$("#cmdWrap").addEventListener("click",e=>{ if(e.target.id==="cmdWrap") closeCmd(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeCmd(); closeModal(); }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); }
});

/* atalho: clicar no nome do app abre ajustes */
$("#appNameEl").addEventListener("click",()=>{ tab="settings"; render(); });
</script>
</body>
</html>
